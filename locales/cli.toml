detail = { zh = "启动时的显示详细程度（full 展开思考，工具仍为简略）。", en = "Initial detail level (full expands thinking; tools stay brief)." }
session_dir = { zh = "指定会话保存目录。", en = "Override the session storage directory." }
port = { zh = "moc web 监听端口（默认优先 7432，被占用时改用随机端口，仅绑定 127.0.0.1）。", en = "Port for moc web (defaults to 7432, falls back to a random port; binds 127.0.0.1 only)." }
