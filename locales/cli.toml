no_open = { zh = "moc web 启动后不自动打开浏览器。", en = "Don't open a browser when moc web starts." }

[cli.repl]
no_prompt = { zh = "--print 未收到提示词或 stdin 输入", en = "--print received no prompt or stdin input" }
signal_exit = { zh = "收到 %{signal}，正在退出", en = "Received %{signal}, exiting" }
core_init_failed = { zh = "初始化 MOC core 失败", en = "Failed to initialize MOC core" }
no_cwd = { zh = "无法打开工作目录 %{path}", en = "Cannot open working directory %{path}" }
no_exe = { zh = "无法定位 moc 可执行文件", en = "Cannot locate the moc executable" }
prompt_word = { zh = "提示词", en = "prompt" }
web_opts = { zh = "web 选项", en = "web options" }
acp_bad_args = { zh = "moc acp 不支持这些参数: %{args}", en = "moc acp does not support these arguments: %{args}" }
notify_slot = { zh = "通知 client 槽位", en = "notify client slot" }
