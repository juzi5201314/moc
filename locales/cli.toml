[cli.help]
group_fmt = { zh = "%{group}:", en = "%{group}:" }
disabled = { zh = "%{desc}（特性已禁用）", en = "%{desc} (feature disabled)" }
alias_of = { zh = "%{desc}（/%{name} 的别名）", en = "%{desc} (alias of /%{name})" }

[cli.commands.debuginfo]
desc = { zh = "工具调用统计、成功率与上下文压缩次数", en = "Tool-call stats, success rates and context-compaction counts" }

[cli.commands.session]
desc = { zh = "当前会话身份、文件路径与分类存储大小", en = "Current session identity, file path and per-kind storage sizes" }

[cli.commands.export]
desc = { zh = "将会话历史脱敏导出为 Markdown", en = "Export redacted session history as Markdown" }

[cli.commands.new]
desc = { zh = "创建新会话", en = "Create a new session" }

[cli.commands.sessions]
desc = { zh = "列出会话", en = "List sessions" }

[cli.commands.cancel]
desc = { zh = "取消当前提示（运行中按 Ctrl+C）", en = "Cancel the current prompt (Ctrl+C while running)" }

[cli.commands.quit]
desc = { zh = "退出", en = "Quit" }

[cli.commands.engine]
desc = { zh = "切换会话引擎（跑过首条提示后引擎锁定）", en = "Switch session engine (locked after the first prompt)" }

[cli.commands.clm_experimental]
desc = { zh = "启用 CLM 实验引擎；首次请求后引擎锁定", en = "Enable the CLM experimental engine; locked after the first request" }

[cli.commands.autonomy]
desc = { zh = "切换自主程度；无参数时循环切换", en = "Switch autonomy level; cycles when called without arguments" }

[cli.commands.permission]
desc = { zh = "切换命令权限或清空本会话 sandbox 授权", en = "Switch command permission or clear this session's sandbox grants" }

[cli.commands.plan]
usage = { zh = "[prompt]", en = "[prompt]" }
desc = { zh = "进入/退出 plan 模式；带 prompt 时进入并发送", en = "Enter/exit plan mode; enters and sends when given a prompt" }

[cli.commands.goal]
desc = { zh = "查看或设置会话目标；目标存在时每轮结束自动续跑，直到达成或叫停", en = "View or set the session goal; while set, each turn auto-continues until reached or stopped" }

[cli.commands.approve]
usage = { zh = "<execute|compact|new [engine]|reject>", en = "<execute|compact|new [engine]|reject>" }
desc = { zh = "处理已提交的计划", en = "Handle a submitted plan" }

[cli.commands.ask]
usage = { zh = "<question>", en = "<question>" }
desc = { zh = "仅本条消息按只读问答模式处理", en = "Handle only this message as read-only Q&A" }

[cli.commands.retry]
desc = { zh = "沿现有上下文继续执行（不追加用户消息，仅空闲时可用）", en = "Continue with the existing context (no new user message; only while idle)" }

[cli.commands.compact_skills]
desc = { zh = "手动压缩 skills 目录或清理摘要缓存，不写会话历史", en = "Manually compact the skills catalog or clear the summary cache; does not write session history" }

[cli.commands.compact]
desc = { zh = "压缩当前上下文", en = "Compact the current context" }

[cli.commands.usage]
desc = { zh = "查看当前会话模型用量", en = "Show model usage of the current session" }

[cli.commands.model]
desc = { zh = "切换模型（装不下当前上下文时先询问再压缩）", en = "Switch model (asks before compacting when the context no longer fits)" }

[cli.commands.agents]
desc = { zh = "列出当前会话的直接 subagent（创建、交流、停止均在 TUI 中完成）", en = "List direct subagents of the current session (create/talk/stop live in the TUI)" }

[cli.commands.mcp]
desc = { zh = "查看当前工作区 MCP 服务状态；reconnect [server] 手动重连", en = "Show MCP server status for this workspace; reconnect [server] to retry" }

[cli.commands.plugins]
desc = { zh = "查看已加载的 plugin；reload 重载宿主并重新发现", en = "Show loaded plugins; reload restarts the plugin host and rediscovers" }

[cli.commands.help]
desc = { zh = "显示本帮助", en = "Show this help" }

[cli.commands.features]
desc = { zh = "特性开关一览：阶段、状态与上下文开销", en = "Feature flags at a glance: stage, state and context cost" }

