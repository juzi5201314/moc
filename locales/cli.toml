no_resumable = { zh = "当前目录没有可恢复的会话", en = "No resumable session in the current directory" }
ctx_warn = { zh = "警告：%{msg}；可用 /compact 立即压缩", en = "Warning: %{msg}; use /compact to compact now" }
prompt_aborted = { zh = "提示已由保护机制终止", en = "Prompt terminated by a guard" }
request_failed = { zh = "请求失败", en = "Request failed" }
session_word = { zh = "会话", en = "Session" }
command_failed = { zh = "命令失败", en = "Command failed" }
arg_sep = { zh = "、", en = ", " }
banner = { zh = "会话 %{id} · %{model} · %{state} · %{cwd} · permission=%{permission}", en = "Session %{id} · %{model} · %{state} · %{cwd} · permission=%{permission}" }

[cli.help]
group_fmt = { zh = "%{group}：", en = "%{group}:" }
disabled = { zh = "%{desc}（特性已禁用）", en = "%{desc} (feature disabled)" }
alias_of = { zh = "%{desc}（/%{name} 的别名）", en = "%{desc} (alias of /%{name})" }

[cli.commands.debuginfo]
desc = { zh = "工具调用统计、成功率与上下文压缩次数", en = "Tool-call stats, success rates and context-compaction counts" }

[cli.commands.session]
desc = { zh = "当前会话身份、文件路径与分类存储大小", en = "Current session identity, file path and per-kind storage sizes" }

[cli.commands.export]
desc = { zh = "将会话历史脱敏导出为 Markdown", en = "Export redacted session history as Markdown" }

[cli.commands.new]
desc = { zh = "创建新会话", en = "Create a new session" }

[cli.commands.sessions]
desc = { zh = "列出会话", en = "List sessions" }

[cli.commands.cancel]
desc = { zh = "取消当前提示（运行中按 Ctrl+C）", en = "Cancel the current prompt (Ctrl+C while running)" }

[cli.commands.quit]
desc = { zh = "退出", en = "Quit" }

[cli.commands.engine]
desc = { zh = "切换会话引擎（跑过首条提示后引擎锁定）", en = "Switch session engine (locked after the first prompt)" }

[cli.commands.clm_experimental]
desc = { zh = "启用 CLM 实验引擎；首次请求后引擎锁定", en = "Enable the CLM experimental engine; locked after the first request" }

[cli.commands.autonomy]
desc = { zh = "切换自主程度；无参数时循环", en = "Switch autonomy level; cycles when called without arguments" }

[cli.commands.permission]
desc = { zh = "切换命令权限或清空本会话沙盒授权", en = "Switch command permission or clear this session's sandbox grants" }

[cli.commands.plan]
usage = { zh = "[提示词]", en = "[prompt]" }
desc = { zh = "进入/退出计划模式；带提示词时进入并发送", en = "Enter/exit plan mode; enters and sends when given a prompt" }

[cli.commands.goal]
desc = { zh = "查看或设置会话目标；目标存在时每轮提示结束自动续跑，直到达成或叫停", en = "View or set the session goal; while set, each prompt auto-continues until reached or stopped" }

[cli.commands.approve]
usage = { zh = "<execute|compact|new [引擎]|reject>", en = "<execute|compact|new [engine]|reject>" }
desc = { zh = "处理已提交的计划", en = "Handle a submitted plan" }

[cli.commands.ask]
usage = { zh = "<问题>", en = "<question>" }
desc = { zh = "仅本条消息按问答模式（只读）处理", en = "Handle only this message as Q&A (read-only)" }

[cli.commands.retry]
desc = { zh = "接着现有上下文继续跑（不追加用户消息，仅空闲时可用）", en = "Continue with the existing context (no new user message; only while idle)" }

[cli.commands.compact_skills]
desc = { zh = "手动压缩技能目录或清理摘要缓存，不写会话历史", en = "Manually compact the skills catalog or clear the summary cache; does not write session history" }

[cli.commands.compact]
desc = { zh = "压缩当前上下文", en = "Compact the current context" }

[cli.commands.usage]
desc = { zh = "查看当前会话模型用量", en = "Show model usage of the current session" }

[cli.commands.model]
desc = { zh = "切换模型（装不下当前上下文时先询问再压缩）", en = "Switch model (asks before compacting when the context no longer fits)" }

[cli.commands.agents]
desc = { zh = "列出当前会话的直接子代理（创建、交流、停止都在 TUI）", en = "List direct subagents of the current session (create/talk/stop live in the TUI)" }

[cli.commands.plugins]
desc = { zh = "查看已加载的插件；reload 重载插件宿主并重新发现", en = "Show loaded plugins; reload restarts the plugin host and rediscovers" }

[cli.commands.help]
desc = { zh = "显示本帮助", en = "Show this help" }

[cli.commands.features]
desc = { zh = "特性开关一览：阶段、状态与上下文成本", en = "Feature flags at a glance: stage, state and context cost" }

