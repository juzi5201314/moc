[cli.display]
bad_engine = { zh = "引擎必须是 standard、ptc 或 clm；计划状态用 /plan，单条只读问答用 /ask <问题>", en = "Engine must be standard, ptc or clm; use /plan for plan mode and /ask <question> for one-shot Q&A" }
over_window = { zh = "当前上下文 %{tokens} token 超过 %{selector} 的窗口 %{window} token", en = "Current context of %{tokens} tokens exceeds %{selector}'s window of %{window} tokens" }
over_threshold = { zh = "当前上下文 %{tokens} token 超过 %{selector} 的压缩触发线 %{threshold} token（窗口 %{window} token）", en = "Current context of %{tokens} tokens exceeds %{selector}'s compaction threshold of %{threshold} tokens (window %{window} tokens)" }
unknown = { zh = "未知", en = "unknown" }
time_split = { zh = "（生成 %{gen}，网络等待 %{net}）", en = " (generating %{gen}, network wait %{net})" }
subagent_model = { zh = "%{model} (子代理)", en = "%{model} (subagent)" }
usage_row = { zh = "模型 %{model}：调用 %{calls} 次，输入 %{input}，输出 %{output}，缓存命中 %{cache_hit} (%{cache_rate}%)，缓存写入 %{cache_write}，思考 %{reasoning}，用时 %{duration}%{split}，首 token 平均 %{ttft}，TPS %{tps}", en = "Model %{model}: %{calls} calls, %{input} in, %{output} out, cache hit %{cache_hit} (%{cache_rate}%), cache write %{cache_write}, reasoning %{reasoning}, %{duration}%{split}, avg TTFT %{ttft}, TPS %{tps}" }
tool_ms = { zh = "工具调用用时 %{ms}", en = "Tool-call time %{ms}" }
no_goal = { zh = "当前没有目标；/goal <objective> 创建\n", en = "No goal; create one with /goal <objective>\n" }
goal_active = { zh = "进行中", en = "active" }
goal_paused = { zh = "已暂停", en = "paused" }
goal_blocked = { zh = "已阻塞", en = "blocked" }
goal_complete = { zh = "已完成", en = "complete" }
goal_head = { zh = "目标：%{objective}\n状态：%{phase}\n", en = "Goal: %{objective}\nStatus: %{phase}\n" }
goal_blocked_by = { zh = "阻塞：%{code}: %{message}\n", en = "Blocked: %{code}: %{message}\n" }
goal_tail = { zh = "轮次：%{rounds}\n续跑：%{armed}\n命令：/goal edit <objective> | /goal pause | /goal resume | /goal clear\n", en = "Rounds: %{rounds}\nContinuation: %{armed}\nCommands: /goal edit <objective> | /goal pause | /goal resume | /goal clear\n" }
goal_armed = { zh = "自动", en = "auto" }
goal_disarmed = { zh = "已停（/goal resume 恢复）", en = "stopped (/goal resume to resume)" }

# ---- 审批与问答交互 ----

[cli.inter]
no_plan = { zh = "当前会话没有等待批准的计划", en = "No plan is awaiting approval in this session" }
choose = { zh = "选择 [默认拒绝]：", en = "Choose [default: reject]: " }
recommended = { zh = " (推荐)", en = " (recommended)" }
input_number = { zh = "输入编号%{multi}或自定义内容：", en = "Enter a number%{multi} or custom text: " }
multi_hint = { zh = "（可用逗号多选）", en = " (comma-separated for multiple)" }
