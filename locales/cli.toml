prompt = { zh = "启动时发送的提示词。", en = "Prompt to send on startup." }
model = { zh = "覆盖会话模型 selector。", en = "Override the session model selector." }
engine = { zh = "新会话的引擎（模型与工具的交互形态；跑过首条提示后锁定）。", en = "Engine for the new session (how the model interacts with tools; locked after the first prompt)." }
plan = { zh = "新会话直接进入 plan 模式（可与任意引擎共存）。", en = "Start the new session in plan mode (works with any engine)." }
cwd = { zh = "会话工作目录。", en = "Working directory for the session." }
config = { zh = "追加配置覆盖层，可重复。", en = "Additional config overlay; repeatable." }
