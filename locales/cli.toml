core_init_failed = { zh = "初始化 MOC core 失败", en = "Failed to initialize MOC core" }
no_cwd = { zh = "无法打开工作目录 %{path}", en = "Cannot open working directory %{path}" }
no_exe = { zh = "无法定位 moc 可执行文件", en = "Cannot locate the moc executable" }
prompt_word = { zh = "prompt", en = "prompt" }
web_opts = { zh = "web options", en = "web options" }
