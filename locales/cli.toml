[cli.args]
about = { zh = "MOC 智能编码助手", en = "MOC AI coding assistant" }
prompt = { zh = "启动时直接发送的 prompt。", en = "Prompt to send on startup." }
model = { zh = "指定会话使用的模型（格式：provider/model）。", en = "Override the session model (provider/model)." }
engine = { zh = "新会话的运行引擎（发出首条消息后锁定）。", en = "Engine for the new session (locked after the first message)." }
plan = { zh = "新会话直接进入 plan 模式。", en = "Start the new session in plan mode." }
cwd = { zh = "指定工作目录。", en = "Working directory for the session." }
config = { zh = "追加配置文件覆盖层，可重复指定。", en = "Additional config file overlay; repeatable." }
resume = { zh = "恢复指定会话；省略 ID 时恢复当前目录最近的会话。", en = "Resume a session; without an ID resumes the latest session in this directory." }
continue = { zh = "继续当前目录最近的会话。", en = "Continue the latest session in this directory." }
list = { zh = "列出已保存的会话。", en = "List saved sessions." }
models = { zh = "列出可用的模型。", en = "List available models." }
print = { zh = "单次运行模式：可从 stdin 读取 prompt，只输出最终结果。", en = "One-shot mode: reads the prompt from stdin and prints only the final answer." }
output_format = { zh = "--print 输出格式：text 输出最终文本；json 结束时输出汇总 JSON；stream-json 逐行输出事件。", en = "Output format for --print: text prints the final answer; json emits a summary object; stream-json emits one NDJSON line per update." }
