_version = 2

[web.commands]
debuginfo.desc = { zh = "工具调用统计、成功率与上下文压缩次数", en = "Tool-call stats, success rate and context-compaction counts" }
export.desc = { zh = "将会话历史脱敏导出为 Markdown", en = "Export redacted session history as Markdown" }
session.desc = { zh = "当前会话身份、文件路径与分类存储大小", en = "Current session identity, file path and per-category storage size" }
new.desc = { zh = "新建会话", en = "Start a new session" }
resume.desc = { zh = "搜索并切换到历史会话", en = "Search and switch to a previous session" }
close.desc = { zh = "关闭当前会话并释放编辑占用", en = "Close the current session and release the edit lock" }
plan.usage = { zh = "[提示]", en = "[hint]" }
plan.desc = { zh = "进入或退出计划状态，可附带提示", en = "Enter or exit plan mode, optionally with a hint" }
confirm_plan.desc = { zh = "重新审阅当前待审计划", en = "Re-review the pending plan" }
goal.desc = { zh = "查看或设置会话目标，启用后自动续跑直到完成或停止", en = "View or set the session goal; auto-continues until completed or stopped" }
autonomy.desc = { zh = "切换自主程度，无参数时循环", en = "Switch autonomy level; cycles without arguments" }
permission.usage = { zh = "[<模式>|clear]", en = "[<mode>|clear]" }
permission.desc = { zh = "切换命令权限模式，或清空本会话沙盒授权", en = "Switch the command permission mode, or clear this session's sandbox grants" }
ask.usage = { zh = "<问题>", en = "<question>" }
ask.desc = { zh = "只读问答：本条提示不改动文件", en = "Read-only Q&A: this prompt does not modify files" }
retry.desc = { zh = "接着当前上下文重新生成", en = "Regenerate from the current context" }
compact_skills.desc = { zh = "手动压缩技能目录或清理摘要缓存，不写会话历史", en = "Manually compact the skills directory or clear summary caches; does not write session history" }
compact.desc = { zh = "压缩当前上下文", en = "Compact the current context" }
model.desc = { zh = "切换模型与思考强度", en = "Switch model and thinking effort" }
engine.desc = { zh = "循环切换会话引擎（仅空白会话可切）", en = "Cycle the session engine (blank sessions only)" }
clm_experimental.desc = { zh = "切换 CLM 实验引擎；启用后本会话固定使用 CLM", en = "Toggle the experimental CLM engine; once enabled this session is pinned to CLM" }
btw.usage = { zh = "<问题>", en = "<question>" }
btw.desc = { zh = "旁路提问，不进入主对话上下文", en = "Ask aside without entering the main conversation context" }
tools.desc = { zh = "查看下一轮请求实际发送的工具", en = "Show the tools actually sent in the next request" }
context.desc = { zh = "查看上下文占用", en = "Show context usage" }
usage.desc = { zh = "查看本会话用量", en = "Show usage for this session" }
settings.desc = { zh = "打开设置", en = "Open settings" }
agents.desc = { zh = "查看当前会话的子代理", en = "List this session's subagents" }
jobs.desc = { zh = "查看和管理后台任务", en = "View and manage background jobs" }
workflow.usage = { zh = "[指令]", en = "[instructions]" }
workflow.desc = { zh = "开启工作流，可附带指令", en = "Activate workflows, optionally with instructions" }
workflows.desc = { zh = "查看工作流运行记录", en = "List workflow runs" }
plugins.desc = { zh = "查看插件：来源、工具与斜杠命令", en = "Inspect plugins: sources, tools and slash commands" }
features.desc = { zh = "特性开关一览：阶段、状态与上下文成本", en = "Feature flags overview: stages, states and context cost" }
help.desc = { zh = "快捷键一览", en = "Keyboard shortcuts" }
doctor.desc = { zh = "环境诊断：连接、服务端与平台能力", en = "Environment diagnostics: connectivity, server and platform capabilities" }
monitor.desc = { zh = "进程资源监控：内存/CPU/磁盘/网络近 10 分钟折线", en = "Process resource monitor: memory/CPU/disk/network trends over the last 10 minutes" }

