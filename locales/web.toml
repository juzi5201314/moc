_version = 2

[web.commands]
debuginfo.desc = { zh = "查看工具调用统计、成功率与 context 压缩次数", en = "Show tool-call stats, success rate, and context compaction counts" }
export.desc = { zh = "将当前 session 历史脱敏导出为 Markdown", en = "Export redacted session history as Markdown" }
session.desc = { zh = "查看当前 session 身份、文件路径与分类存储大小", en = "Show current session identity, file path, and per-category storage size" }
new.desc = { zh = "新建 session", en = "Start a new session" }
resume.desc = { zh = "搜索并切换到历史 session", en = "Search and switch to a previous session" }
close.desc = { zh = "关闭当前 session 并释放编辑锁", en = "Close the current session and release the edit lock" }
plan.usage = { zh = "[prompt]", en = "[prompt]" }
plan.desc = { zh = "进入或退出 plan 模式，可附带提示", en = "Enter or exit plan mode, optionally with a prompt" }
confirm_plan.desc = { zh = "重新审阅当前待审批计划", en = "Re-review the pending plan" }
goal.desc = { zh = "查看或设置 session 目标，开启后自动续跑直至完成或停止", en = "View or set the session goal; auto-continues until completed or stopped" }
autonomy.desc = { zh = "切换自主程度，不带参数时依次循环", en = "Switch autonomy level; cycles without arguments" }
permission.usage = { zh = "[<mode>|clear]", en = "[<mode>|clear]" }
permission.desc = { zh = "切换 command 权限模式，或清空本 session 的 sandbox 授权", en = "Switch the command permission mode, or clear this session's sandbox grants" }
ask.usage = { zh = "<question>", en = "<question>" }
ask.desc = { zh = "只读问答：本条 prompt 不改动任何文件", en = "Read-only Q&A: this prompt does not modify files" }
retry.desc = { zh = "基于当前 context 重新生成回复", en = "Regenerate from the current context" }
compact_skills.desc = { zh = "手动压缩 skills 目录或清理摘要 cache，不写入历史记录", en = "Manually compact the skills catalog or clear summary caches without writing history" }
compact.desc = { zh = "压缩当前对话 context", en = "Compact the current context" }
model.desc = { zh = "切换 model 与 thinking effort", en = "Switch model and thinking effort" }
engine.desc = { zh = "切换 session 引擎（仅空白 session 可切）", en = "Cycle the session engine (blank sessions only)" }
clm_experimental.desc = { zh = "切换 CLM 实验引擎，启用后本 session 固定使用 CLM", en = "Toggle the experimental CLM engine; once enabled this session is pinned to CLM" }
btw.usage = { zh = "<question>", en = "<question>" }
btw.desc = { zh = "旁路提问，不进入主对话 context", en = "Ask aside without entering the main conversation context" }
tools.desc = { zh = "查看下一轮请求实际发送的工具列表", en = "Show the tools sent in the next request" }
context.desc = { zh = "查看当前 context 占用构成", en = "Inspect current context usage" }
usage.desc = { zh = "查看本 session 的 token 与费用统计", en = "Show token and cost usage for this session" }
settings.desc = { zh = "打开设置面板", en = "Open settings" }
agents.desc = { zh = "查看当前 session 的 subagent 状态", en = "List subagents in this session" }
jobs.desc = { zh = "查看和管理后台任务", en = "View and manage background jobs" }
workflow.usage = { zh = "[instruction]", en = "[instruction]" }
workflow.desc = { zh = "开启 workflow，可附带执行指令", en = "Activate workflow, optionally with instructions" }
workflows.desc = { zh = "查看 workflow 运行记录", en = "List workflow runs" }
mcp.desc = { zh = "查看 MCP 服务状态或手动重连", en = "Inspect MCP server status or reconnect" }
plugins.desc = { zh = "查看 plugin 来源、工具与斜杠命令", en = "Inspect plugins: sources, tools, and slash commands" }
features.desc = { zh = "查看特性开关阶段、状态与 context 开销", en = "Feature flags overview: stage, status, and context cost" }
help.desc = { zh = "查看快捷键一览", en = "Show keyboard shortcuts" }
doctor.desc = { zh = "诊断连接、服务端与平台运行环境", en = "Diagnose connectivity, server, and platform capabilities" }
monitor.desc = { zh = "查看进程近 10 分钟内存、CPU、磁盘与网络趋势", en = "Monitor process memory, CPU, disk, and network over the last 10 minutes" }

