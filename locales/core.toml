[core.config.fields.features_clm]
label = { zh = "CLM Engine", en = "CLM Engine" }
desc = { zh = "启用实验性 CLM session 引擎，由 model 自主维护工作 context。", en = "Enable the experimental CLM session engine, letting the model manage its working context." }

[core.config.fields.features_ptc]
