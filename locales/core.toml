desc = { zh = "Explore 角色使用的 model；inherit 沿用主 model，none 禁用。", en = "Model for the Explore role; inherit reuses the main model, none disables it." }

[core.config.fields.models_fusion_lead]
label = { zh = "Fusion Lead", en = "Fusion Lead" }
desc = { zh = "负责规划、调查与评审的主导 model（格式：provider/model[:level]）。", en = "Lead model for planning, investigation, and review (format: provider/model[:level])." }

[core.config.fields.models_fusion_sidekick]
label = { zh = "Fusion Sidekick", en = "Fusion Sidekick" }
desc = { zh = "负责具体实现与测试的执行 model（格式：provider/model[:level]）。", en = "Execution model for implementation and testing (format: provider/model[:level])." }

[core.config.fields.context_files_enabled]
