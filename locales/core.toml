desc = { zh = "软修剪时保留开头的字符数。", en = "Characters kept at the start during soft trimming." }

[core.config.keys.tail_chars]
label = { zh = "软修剪保留结尾", en = "Soft-trim tail chars" }
desc = { zh = "软修剪时保留结尾的字符数。", en = "Characters kept at the end during soft trimming." }

[core.config.keys.hard_clear_prompts]
label = { zh = "硬清理轮数阈值", en = "Hard-clear turn threshold" }
desc = { zh = "距今超过该用户轮次的旧工具结果将被完全清空内容。", en = "Tool results older than this many user turns are fully cleared." }

[core.config.keys.keep_last_prompts]
label = { zh = "保护最近轮数", en = "Protect recent turns" }
desc = { zh = "最近这些用户轮次内的工具结果不会被硬清理。", en = "Tool results within the last N user turns are never hard-cleared." }

[core.config.keys.supersede_reads]
label = { zh = "去重旧文件读取", en = "Supersede old file reads" }
desc = { zh = "同一文件被重新读取后，自动清理更早的读取结果。", en = "After a file is re-read, earlier read results for it are cleaned automatically." }

[core.config.keys.max_length_continues]
label = { zh = "截断自动续写次数", en = "Auto-continue after cutoff" }
desc = { zh = "回复因输出上限截断后自动续写的最大次数。", en = "Maximum automatic continuations after a response is cut off by the output cap." }

[core.config.keys.loop_detection]
label = { zh = "死循环检测", en = "Loop detection" }
desc = { zh = "检测思考、正文与工具参数中出现的重复死循环。", en = "Detect repeated loops in thinking, body text and tool arguments." }

[core.config.keys.connect_deadline_secs]
label = { zh = "连接与重试硬时限（秒）", en = "Connect & retry deadline (s)" }
desc = { zh = "流式请求收到响应头前或非流式全流程的硬超时（流式生成阶段不限时）。", en = "Hard timeout before response headers for streaming, or for the whole non-streaming request (the streaming phase itself is unbounded)." }

[core.config.keys.request_warn_secs]
label = { zh = "请求慢响应提醒（秒）", en = "Slow-request reminder (s)" }
desc = { zh = "单次请求耗时超过该值时发出提醒通知，不中断请求。", en = "Emit a reminder notification when a request takes longer than this; the request continues." }

[core.config.keys.max_scan_entries]
label = { zh = "文件查找扫描上限", en = "Find scan cap" }
desc = { zh = "find 工具单次查找最多扫描的条目数。", en = "Maximum entries scanned per find call." }

[core.config.keys.url]
label = { zh = "服务 URL", en = "Service URL" }
desc = { zh = "远程 MCP 服务的 HTTP 地址。", en = "HTTP address of a remote MCP server." }

[core.config.keys.compress]
label = { zh = "压缩会话日志", en = "Compress session logs" }
desc = { zh = "新会话以 zstd 格式保存（.jsonl.zst）；读取自动兼容未压缩历史。", en = "New sessions are stored zstd-compressed (.jsonl.zst); uncompressed history still reads fine." }

[core.config.keys.dir]
label = { zh = "会话存储目录", en = "Session store dir" }
desc = { zh = "会话历史与运行记录存储路径（重启生效）。", en = "Where session history and run records are stored (applies after restart)." }

[core.config.keys.artifacts_days]
label = { zh = "临时产物保留天数", en = "Artifact retention days" }
desc = { zh = "超过该天数且无引用的产物可被清理。", en = "Artifacts older than this with no references may be cleaned." }

[core.config.keys.logs_days]
label = { zh = "任务日志保留天数", en = "Job log retention days" }
desc = { zh = "超过该天数的日志可被清理。", en = "Logs older than this may be cleaned." }

[core.config.keys.command]
label = { zh = "启动命令", en = "Command" }
desc = { zh = "stdio 模式下运行的本地可执行程序。", en = "Local executable run in stdio mode." }

[core.config.keys.args]
label = { zh = "启动参数", en = "Arguments" }
desc = { zh = "逐行填写命令行参数。", en = "One command-line argument per line." }

[core.config.keys.env]
label = { zh = "环境变量", en = "Environment" }
desc = { zh = "JSON 键值对，附加到该进程的运行环境。", en = "JSON key-value pairs added to the process environment." }

[core.config.keys.cwd]
label = { zh = "工作目录", en = "Working directory" }
desc = { zh = "MCP 进程的工作目录。", en = "Working directory of the MCP process." }

[core.config.keys.type]
label = { zh = "传输方式", en = "Transport" }
desc = { zh = "stdio 为本地进程，http 为远程服务。", en = "stdio is a local process, http a remote service." }

[core.config.keys.allow]
label = { zh = "工具白名单", en = "Tool allowlist" }
desc = { zh = "逐行填写允许暴露的工具名，支持 * 通配；留空不限制。", en = "One tool name per line allowed to be exposed, * wildcards supported; empty means unrestricted." }

[core.config.keys.deny]
label = { zh = "工具黑名单", en = "Tool denylist" }
desc = { zh = "逐行填写禁用的工具名，支持 * 通配。", en = "One tool name per line to disable, * wildcards supported." }

[core.config.keys.supports_stop]
label = { zh = "支持停止序列", en = "Stop sequences" }
desc = { zh = "关闭后不发送 `stop` / `stop_sequences`，包括扩展请求体中的设置。", en = "When off, neither `stop`/`stop_sequences` nor matching fields in the extra body are sent." }

[core.config.keys.supports_prompt_cache_key]
label = { zh = "支持提示缓存键", en = "Prompt cache key" }
desc = { zh = "关闭后不发送 `prompt_cache_key`、`prompt_cache_options` 和 `prompt_cache_retention`。", en = "When off, `prompt_cache_key`, `prompt_cache_options` and `prompt_cache_retention` are not sent." }

[core.config.keys.max_output_tokens_field]
label = { zh = "Chat 输出上限字段名", en = "Chat output-cap field" }
desc = { zh = "Chat 使用 `max_tokens` 或 `max_completion_tokens`；不影响 Responses 与 Anthropic。", en = "Chat uses `max_tokens` or `max_completion_tokens`; Responses and Anthropic are unaffected." }

[core.config.keys.reasoning_field]
label = { zh = "Reasoning 字段名", en = "Reasoning field" }
desc = { zh = "回传思考内容时使用的 JSON 字段名。", en = "JSON field carrying returned thinking content." }

[core.config.keys.reasoning_field_aliases]
label = { zh = "Reasoning 响应别名", en = "Reasoning aliases" }
desc = { zh = "逐行填写解析响应思考内容时识别的字段别名。", en = "One field alias per line recognized when parsing thinking content." }

[core.config.keys.tool_choice_dialect]
label = { zh = "tool_choice 方言", en = "tool_choice dialect" }
desc = { zh = "按网关兼容性选择标准、改写或不发送。", en = "Choose standard, rewritten, or omitted per gateway compatibility." }

[core.config.keys.parallel_tool_calls]
label = { zh = "并行工具调用", en = "Parallel tool calls" }
desc = { zh = "上游接口是否支持 parallel_tool_calls。", en = "Whether the upstream API supports parallel_tool_calls." }

[core.config.keys.developer_role]
label = { zh = "支持 developer 角色", en = "developer role" }
desc = { zh = "关闭后将 developer 消息降级为 system 角色发送。", en = "When off, developer messages are sent downgraded to the system role." }

[core.config.keys.response_format_dialect]
label = { zh = "response_format 方言", en = "response_format dialect" }
desc = { zh = "结构化输出协议兼容模式。", en = "Compatibility mode for structured-output protocols." }

[core.config.keys.echo_reasoning]
label = { zh = "回传历史思考", en = "Echo past reasoning" }
desc = { zh = "多轮工具调用时是否按协议回传历史思考内容。", en = "Whether past thinking is echoed back per protocol during multi-turn tool calls." }

[core.config.keys.requires_reasoning_content_for_tool_calls]
label = { zh = "工具消息需携带思考字段", en = "Tool calls need reasoning field" }
desc = { zh = "发送工具调用历史时强制保留思考内容字段。", en = "Force-keep the reasoning field when sending tool-call history." }

[core.config.keys.requires_reasoning_content_for_all_assistant_turns]
label = { zh = "全助手轮次需携带思考字段", en = "All turns need reasoning field" }
desc = { zh = "所有历史助手消息都强制携带思考内容字段。", en = "Force every historical assistant message to carry the reasoning field." }

[core.config.keys.requires_assistant_content_for_tool_calls]
label = { zh = "工具消息需携带 content", en = "Tool calls need content" }
desc = { zh = "包含工具调用的历史消息强制携带非空 content 字段。", en = "Force non-empty content on historical messages containing tool calls." }

[core.config.keys.toggle_field]
label = { zh = "思考开关字段名", en = "Thinking toggle field" }
desc = { zh = "请求体中控制思考开关的字段名；留空不发送。", en = "Request-body field toggling thinking; empty means not sent." }

[core.config.keys.enabled_value]
label = { zh = "开启取值", en = "Enabled value" }
desc = { zh = "请求体中表示开启思考的字段值。", en = "Field value that enables thinking in the request body." }

[core.config.keys.disabled_value]
label = { zh = "关闭取值", en = "Disabled value" }
desc = { zh = "请求体中表示关闭思考的字段值。", en = "Field value that disables thinking in the request body." }

[core.config.keys.effort_field]
label = { zh = "思考强度字段名", en = "Thinking effort field" }
desc = { zh = "请求体中控制思考强度的字段名；留空不发送。", en = "Request-body field controlling thinking effort; empty means not sent." }

[core.config.keys.effort_map]
label = { zh = "思考等级映射", en = "Thinking-level map" }
desc = { zh = "将思考等级映射为上游接口接受的值；未配置项原样发送。", en = "Map thinking levels to values the upstream accepts; unmapped levels are sent as-is." }

[core.config.keys.toggle_extra]
label = { zh = "思考附加字段", en = "Thinking extra fields" }
desc = { zh = "JSON：合并到思考开关对象中的附加字段。", en = "JSON merged into the thinking-toggle object." }

[core.config.keys.language]
label = { zh = "界面语言", en = "Language" }
desc = { zh = "auto 跟随系统环境；zh/en 强制指定，重启前端进程后生效。", en = "auto follows the system locale; zh/en force a language and apply after restarting the frontend." }

# ---- 请求参数（parameters.rs），键 = 参数名点号转下划线 ----

[core.params]
invalid_value = { zh = "%{label}.%{name} 的值或类型不正确：%{desc}", en = "%{label}.%{name} has an invalid value or type: %{desc}" }
invalid_effort = { zh = "%{label}.%{effort} 需要小写思考等级名", en = "%{label}.%{effort} requires a lowercase thinking-level name" }
invalid_stop = { zh = "%{label}.%{name} 需要字符串数组；stop 也允许单个字符串，最多 4 项", en = "%{label}.%{name} requires a string array; stop also accepts a single string, up to 4 items" }

[core.params.temperature]
label = { zh = "采样温度", en = "Sampling temperature" }
desc = { zh = "越低越稳定，越高越随机；仅支持此参数的模型可用，通常与 top_p 二选一。", en = "Lower is steadier, higher more random; only on models that support it, and usually chosen instead of top_p." }

[core.params.top_p]
label = { zh = "核采样比例", en = "Nucleus sampling" }
desc = { zh = "仅从累计概率达到此比例的候选中采样；通常与 temperature 二选一。", en = "Sample only from candidates up to this cumulative probability; usually chosen instead of temperature." }

[core.params.store]
label = { zh = "上游保存响应", en = "Store responses upstream" }
desc = { zh = "控制上游是否保存请求与响应；可能涉及数据留存。Chat 默认 false，Responses 默认 true。", en = "Whether the upstream stores requests and responses; may involve data retention. Chat defaults to false, Responses to true." }

[core.params.metadata]
label = { zh = "请求元数据", en = "Request metadata" }
desc = { zh = "附加键值信息；最多 16 项，键不超过 64 字符，字符串值不超过 512 字符。不要填写敏感信息。", en = "Extra key-value data; up to 16 entries, keys ≤ 64 chars, string values ≤ 512 chars. Do not put sensitive data here." }

[core.params.user]
label = { zh = "旧版用户标识", en = "Legacy user ID" }
desc = { zh = "已弃用；优先使用 safety_identifier 和 prompt_cache_key，不要填写姓名或邮箱。", en = "Deprecated; prefer safety_identifier and prompt_cache_key. Do not put names or emails here." }

[core.params.safety_identifier]
label = { zh = "安全用户标识", en = "Safety identifier" }
desc = { zh = "用于上游滥用检测的稳定标识，最长 128 字符；建议使用不可逆哈希。", en = "Stable ID for upstream abuse detection, up to 128 chars; an irreversible hash is recommended." }

[core.params.service_tier]
label = { zh = "服务档位", en = "Service tier" }
desc = { zh = "选择处理速度与计费档位；需要模型和账号支持。会话 Fast Mode 开启时优先使用 fast。", en = "Processing speed and billing tier; requires model and account support. Session fast mode takes precedence with fast." }

[core.params.parallel_tool_calls]
label = { zh = "并行工具调用", en = "Parallel tool calls" }
desc = { zh = "允许一次请求调用多个函数；协议兼容开关关闭时不发送此字段。", en = "Allow multiple function calls per request; not sent when the protocol-compat switch is off." }

[core.params.prompt_cache_key]
label = { zh = "提示缓存路由键", en = "Prompt cache key" }
desc = { zh = "覆盖 moc 默认的会话缓存键，让相同前缀使用同一缓存路由。", en = "Overrides moc's default session cache key so identical prefixes share a cache route." }

[core.params.prompt_cache_options_mode]
label = { zh = "缓存匹配模式", en = "Cache match mode" }
desc = { zh = "implicit 自动选择缓存前缀；explicit 只使用显式断点，没有断点时不使用提示缓存。", en = "implicit picks a cache prefix automatically; explicit uses only explicit breakpoints — no breakpoint, no prompt cache." }

[core.params.prompt_cache_options_ttl]
label = { zh = "缓存最短存活时间", en = "Cache minimum TTL" }
desc = { zh = "30m 为 30 分钟；Responses 还支持 12h（12 小时），具体需要上游支持。", en = "30m means 30 minutes; Responses also supports 12h (12 hours), subject to upstream support." }

[core.params.prompt_cache_retention]
label = { zh = "旧版缓存保留策略", en = "Legacy cache retention" }
desc = { zh = "已弃用；in_memory 使用内存缓存，24h 延长保留时间，优先使用 prompt_cache_options.ttl。", en = "Deprecated; in_memory caches in memory, 24h extends retention — prefer prompt_cache_options.ttl." }

[core.params.stream_options_include_obfuscation]
label = { zh = "流式传输混淆", en = "Stream obfuscation" }
desc = { zh = "增加随机填充以减少侧信道信息；关闭可节省带宽，但会降低此保护。", en = "Adds random padding to reduce side-channel leakage; disabling saves bandwidth at the cost of this protection." }

[core.params.top_logprobs]
label = { zh = "候选 token 概率数量", en = "Top token logprobs" }
desc = { zh = "返回每个位置最多 0–20 个候选概率；Chat 还需开启 logprobs。moc 不单独展示概率表。", en = "Return up to 0–20 candidate probabilities per position; Chat also needs logprobs. moc does not display a probability table." }

[core.params.moderation_model]
label = { zh = "内容审核模型", en = "Moderation model" }
desc = { zh = "审核输入与输出使用的模型，例如 omni-moderation-latest；需要上游支持。", en = "Model used to moderate input and output, e.g. omni-moderation-latest; requires upstream support." }

[core.params.moderation_policy_input_mode]
label = { zh = "输入审核策略", en = "Input moderation policy" }
desc = { zh = "score 只评分，block 拦截违规输入。", en = "score only rates, block rejects violating input." }

[core.params.moderation_policy_output_mode]
label = { zh = "输出审核策略", en = "Output moderation policy" }
desc = { zh = "score 只评分，block 拦截违规输出。", en = "score only rates, block rejects violating output." }

[core.params.tool_choice]
label = { zh = "工具选择策略", en = "Tool choice" }
desc = { zh = "JSON：\"auto\" 自动选择、\"none\" 禁用、\"required\" 必须调用；指定函数时 Chat 使用 {\"type\":\"function\",\"function\":{\"name\":\"read\"}}，Responses 使用 {\"type\":\"function\",\"name\":\"read\"}。仅选择 moc 已提供的函数。", en = "JSON: \"auto\" picks automatically, \"none\" disables, \"required\" forces a call; for a specific function Chat takes {\"type\":\"function\",\"function\":{\"name\":\"read\"}}, Responses takes {\"type\":\"function\",\"name\":\"read\"}. Only choose among functions moc already provides." }

[core.params.frequency_penalty]
label = { zh = "重复频率惩罚", en = "Frequency penalty" }
desc = { zh = "范围 -2–2；正值减少重复词句，负值增加重复倾向。", en = "Range -2 to 2; positive reduces repeated phrases, negative encourages them." }

[core.params.presence_penalty]
label = { zh = "重复主题惩罚", en = "Presence penalty" }
desc = { zh = "范围 -2–2；正值鼓励新话题，负值更倾向已有话题。", en = "Range -2 to 2; positive encourages new topics, negative sticks to existing ones." }

[core.params.logit_bias]
label = { zh = "token 概率偏置", en = "Logit bias" }
desc = { zh = "JSON 对象：token ID 映射到 -100–100 的偏置；例如 {\"123\":-10}。", en = "JSON object mapping token IDs to -100–100 bias, e.g. {\"123\":-10}." }

[core.params.logprobs]
label = { zh = "返回 token 概率", en = "Return logprobs" }
desc = { zh = "请求输出 token 的对数概率；moc 不单独展示概率表。", en = "Request output-token log probabilities; moc does not display a probability table." }

[core.params.n]
label = { zh = "生成候选数量", en = "Candidate count" }
desc = { zh = "范围 1–128；moc 只消费第一个候选，其余候选仍会产生费用，通常保持 1。", en = "Range 1–128; moc only consumes the first candidate while the rest still cost — usually keep 1." }

[core.params.seed]
label = { zh = "采样随机种子", en = "Sampling seed" }
desc = { zh = "有符号整数；相同种子仅尽力保持一致，并不保证确定性。Web 编辑器仅接受精确可表示的整数。", en = "Signed integer; the same seed is only best-effort consistent, not deterministic. The web editor accepts exactly representable integers only." }

[core.params.reasoning_effort]
label = { zh = "默认思考强度", en = "Default thinking effort" }
desc = { zh = "none 关闭，或填写 minimal、low、medium、high、xhigh、max／自定义等级；会话显式选择优先，需包含在模型的可选思考等级中。", en = "none disables, or use minimal/low/medium/high/xhigh/max or a custom level; an explicit session choice wins and the level must be among the model's thinking_levels." }

[core.params.verbosity]
label = { zh = "回复详细程度", en = "Response verbosity" }
desc = { zh = "low 更简洁，medium 适中，high 更详细；仅支持此参数的模型可用。", en = "low is terser, medium balanced, high more detailed; only on models that support it." }

[core.params.stop]
label = { zh = "停止序列", en = "Stop sequences" }
desc = { zh = "JSON 字符串或字符串数组，最多 4 项；保留逗号和换行，命中后停止生成。部分推理模型不支持。", en = "JSON string or string array, up to 4 items; commas and newlines preserved, generation stops on hit. Some reasoning models don't support it." }

[core.params.stream_options_include_usage]
label = { zh = "流式用量统计", en = "Stream usage stats" }
desc = { zh = "moc 默认 true；关闭后可能缺少准确的 token 用量和费用统计。", en = "moc defaults to true; disabling may lose accurate token-usage and cost stats." }

[core.params.prediction_type]
label = { zh = "预期输出类型", en = "Prediction type" }
desc = { zh = "预期输出内容的类型，固定为 content；仅支持 Predicted Outputs 的模型可用。", en = "Type of the predicted output, fixed to content; only on models supporting Predicted Outputs." }

[core.params.prediction_content]
label = { zh = "预期输出内容", en = "Prediction content" }
desc = { zh = "JSON 字符串或文本内容块数组，用于大部分输出已知的场景；会发送给上游。", en = "JSON string or array of text content blocks for when most of the output is known; sent to the upstream." }

[core.params.response_format_type]
label = { zh = "输出格式", en = "Response format" }
desc = { zh = "text 普通文本、json_object JSON 对象、json_schema 按指定结构输出；JSON 模式需要提示词说明。", en = "text for plain text, json_object for a JSON object, json_schema for a given structure; JSON modes need the prompt to describe it." }

[core.params.response_format_json_schema_name]
label = { zh = "输出结构名称", en = "Schema name" }
desc = { zh = "JSON Schema 的名称，最长 64 字符，仅使用字母、数字、下划线和连字符。", en = "JSON Schema name, up to 64 chars: letters, digits, underscores and hyphens only." }

[core.params.response_format_json_schema_description]
label = { zh = "输出结构说明", en = "Schema description" }
desc = { zh = "解释此结构的用途，帮助模型理解期望输出。", en = "Explain what this structure is for so the model understands the expected output." }

[core.params.response_format_json_schema_schema]
label = { zh = "输出 JSON Schema", en = "Output JSON Schema" }
desc = { zh = "JSON 对象，定义期望的输出结构；例如 {\"type\":\"object\",\"properties\":{}}。", en = "JSON object defining the expected output structure, e.g. {\"type\":\"object\",\"properties\":{}}." }

[core.params.response_format_json_schema_strict]
label = { zh = "严格遵循输出结构", en = "Strict schema" }
desc = { zh = "开启后严格遵循 schema；只支持上游允许的 JSON Schema 子集。", en = "When on, follow the schema strictly; only the upstream-supported JSON Schema subset applies." }

[core.params.reasoning_summary]
label = { zh = "思考摘要详细程度", en = "Reasoning summary detail" }
desc = { zh = "auto 由模型决定，concise 简洁，detailed 详细；moc 默认 auto，关闭思考时不发送摘要请求。", en = "auto lets the model decide, concise is brief, detailed is thorough; moc defaults to auto and sends no summary request when thinking is off." }

[core.params.reasoning_generate_summary]
label = { zh = "旧版思考摘要", en = "Legacy reasoning summary" }
desc = { zh = "已弃用，优先使用 reasoning.summary；未配置 summary 时使用此值。", en = "Deprecated; prefer reasoning.summary — used only when summary is unset." }

[core.params.reasoning_context]
label = { zh = "历史思考范围", en = "Reasoning context" }
desc = { zh = "auto 由模型决定，current_turn 仅当前轮，all_turns 包含全部轮次。", en = "auto lets the model decide, current_turn is this turn only, all_turns includes every turn." }

[core.params.reasoning_mode]
label = { zh = "思考执行模式", en = "Reasoning mode" }
desc = { zh = "例如 standard 或 pro；原样发送，是否支持由模型与上游决定。", en = "e.g. standard or pro; sent as-is, support depends on the model and upstream." }

[core.params.text_verbosity]
label = { zh = "回复详细程度", en = "Response verbosity" }
desc = { zh = "low 更简洁，medium 适中，high 更详细；与 reasoning.summary 的思考摘要粒度无关。", en = "low is terser, medium balanced, high more detailed; independent of the reasoning.summary granularity." }

[core.params.text_format_type]
label = { zh = "输出格式", en = "Response format" }
desc = { zh = "text 普通文本、json_object JSON 对象、json_schema 按指定结构输出；JSON 模式需要提示词说明。", en = "text for plain text, json_object for a JSON object, json_schema for a given structure; JSON modes need the prompt to describe it." }

[core.params.text_format_name]
label = { zh = "输出结构名称", en = "Schema name" }
desc = { zh = "JSON Schema 的名称，最长 64 字符，仅使用字母、数字、下划线和连字符。", en = "JSON Schema name, up to 64 chars: letters, digits, underscores and hyphens only." }

[core.params.text_format_description]
label = { zh = "输出结构说明", en = "Schema description" }
desc = { zh = "解释此结构的用途，帮助模型理解期望输出。", en = "Explain what this structure is for so the model understands the expected output." }

[core.params.text_format_schema]
label = { zh = "输出 JSON Schema", en = "Output JSON Schema" }
desc = { zh = "JSON 对象，定义期望的输出结构。", en = "JSON object defining the expected output structure." }

[core.params.text_format_strict]
label = { zh = "严格遵循输出结构", en = "Strict schema" }
desc = { zh = "开启后严格遵循 schema；只支持上游允许的 JSON Schema 子集。", en = "When on, follow the schema strictly; only the upstream-supported JSON Schema subset applies." }

[core.params.include]
label = { zh = "附加返回数据", en = "Extra returned data" }
desc = { zh = "字符串列表，例如 message.output_text.logprobs、message.input_image.image_url；moc 会按思考回传策略追加 reasoning.encrypted_content。", en = "String list, e.g. message.output_text.logprobs, message.input_image.image_url; moc appends reasoning.encrypted_content per the reasoning-echo policy." }

[core.params.truncation]
label = { zh = "上游超长输入处理", en = "Upstream truncation" }
desc = { zh = "disabled 超长时报错，auto 允许上游丢弃开头的历史；auto 可能丢失早期指令。", en = "disabled errors on overlong input, auto lets the upstream drop the earliest history — which may lose early instructions." }

[core.params.prompt_id]
label = { zh = "上游提示模板 ID", en = "Upstream prompt template ID" }
desc = { zh = "使用已经在上游创建的提示模板；模板可能改变请求指令。", en = "Use a prompt template already created upstream; the template may alter request instructions." }

[core.params.prompt_version]
label = { zh = "提示模板版本", en = "Prompt template version" }
desc = { zh = "指定已创建模板的版本；留空使用上游默认版本。", en = "Pin a created template's version; empty uses the upstream default." }

[core.params.prompt_variables]
label = { zh = "提示模板变量", en = "Prompt template variables" }
desc = { zh = "JSON 对象：变量名映射到字符串或上游支持的文本／图片输入对象。", en = "JSON object mapping variable names to strings or upstream-supported text/image input objects." }

[core.params.prompt_cache_options_comparison_response_id]
label = { zh = "缓存对比响应 ID", en = "Cache-compare response ID" }
desc = { zh = "填写已有响应 ID，请求上游诊断与该响应的缓存差异；moc 不自动维护此 ID。", en = "Fill in an existing response ID to ask the upstream to diagnose cache differences against it; moc does not maintain this ID." }

[core.params.image_context_compression]
label = { zh = "上游图片上下文压缩", en = "Upstream image compression" }
desc = { zh = "auto 自动决定、enabled 要求支持压缩、disabled 关闭；不改变 moc 本地图片预算。", en = "auto decides automatically, enabled requires compression support, disabled turns it off; does not change moc's local image budget." }

[core.params.access_programs_cyber]
label = { zh = "Cyber 访问计划", en = "Cyber access program" }
desc = { zh = "standard、daybreak_blue 或 daybreak_red；需账号与模型授权，否则上游会拒绝。", en = "standard, daybreak_blue or daybreak_red; requires account and model authorization or the upstream rejects it." }

[core.params.top_k]
label = { zh = "采样候选数量", en = "Top-k candidates" }
desc = { zh = "仅从概率最高的 K 个候选中采样；只对支持此参数的模型发送。", en = "Sample only from the K most likely candidates; sent only to models supporting it." }

[core.params.stop_sequences]
label = { zh = "停止序列", en = "Stop sequences" }
desc = { zh = "字符串列表；JSON 数组可精确保留逗号和换行，命中后停止生成。", en = "String list; a JSON array preserves commas and newlines exactly, generation stops on hit." }

[core.params.thinking_type]
label = { zh = "思考模式", en = "Thinking mode" }
desc = { zh = "adaptive 自适应、enabled 使用预算、disabled 关闭、between_tools 在工具间思考；会话 off 优先，取值需模型支持。", en = "adaptive adapts, enabled uses a budget, disabled turns off, between_tools thinks between tools; session off wins and the value needs model support." }

[core.params.thinking_budget_tokens]
label = { zh = "思考 token 预算", en = "Thinking token budget" }
desc = { zh = "enabled 模式下至少 1024，且小于回复 token 上限；预算计入 max_tokens。", en = "At least 1024 in enabled mode and below the response token cap; the budget counts toward max_tokens." }

[core.params.thinking_display]
label = { zh = "思考返回方式", en = "Thinking display" }
desc = { zh = "summarized 返回思考摘要，omitted 隐藏内容但保留签名；moc 默认 summarized。", en = "summarized returns a thinking summary, omitted hides content but keeps the signature; moc defaults to summarized." }

[core.params.output_config_effort]
label = { zh = "默认思考强度", en = "Default thinking effort" }
desc = { zh = "low、medium、high、xhigh、max／自定义等级；会话显式选择优先。enabled + budget_tokens 模式使用此值，不自动附加会话强度。", en = "low/medium/high/xhigh/max or a custom level; an explicit session choice wins. The enabled + budget_tokens mode uses this value and does not auto-append the session level." }

[core.params.output_config_format_type]
label = { zh = "输出格式", en = "Output format" }
desc = { zh = "结构化输出类型，固定为 json_schema。", en = "Structured output type, fixed to json_schema." }

[core.params.output_config_format_schema]
label = { zh = "输出 JSON Schema", en = "Output JSON Schema" }
desc = { zh = "JSON 对象，定义期望的输出结构。", en = "JSON object defining the expected output structure." }

[core.params.metadata_user_id]
label = { zh = "外部用户标识", en = "External user ID" }
desc = { zh = "使用 UUID、哈希或其他不透明标识；不要发送姓名、邮箱、电话号码等个人信息。", en = "Use a UUID, hash or other opaque ID; do not send personal info such as names, emails or phone numbers." }

[core.params.anthropic.service_tier]
label = { zh = "服务容量档位", en = "Service capacity tier" }
desc = { zh = "auto 可使用优先容量，standard_only 只使用标准容量；需账号支持。", en = "auto may use prioritized capacity, standard_only sticks to standard capacity; requires account support." }

[core.params.speed]
label = { zh = "推理速度模式", en = "Inference speed mode" }
desc = { zh = "standard 标准、fast 高速；部分模型需要 anthropic-beta 中的 fast-mode-2026-02-01。", en = "standard or fast; some models need fast-mode-2026-02-01 in anthropic-beta." }

[core.params.inference_geo]
label = { zh = "推理处理区域", en = "Inference region" }
desc = { zh = "指定上游推理区域；留空使用工作区默认区域，需要账号支持。", en = "Pin the upstream inference region; empty uses the workspace default and requires account support." }

[core.params.cache_control_type]
label = { zh = "自动缓存类型", en = "Auto cache type" }
desc = { zh = "固定为 ephemeral，让上游在最后一个可缓存块设置断点；与 moc 显式缓存断点可同时存在。", en = "Fixed to ephemeral so the upstream sets a breakpoint on the last cacheable block; may coexist with moc's explicit breakpoints." }

[core.params.cache_control_ttl]
label = { zh = "自动缓存存活时间", en = "Auto cache TTL" }
desc = { zh = "5m 为 5 分钟，1h 为 1 小时；长缓存可能改变费用。", en = "5m is 5 minutes, 1h is 1 hour; longer caching may change billing." }

[core.params.diagnostics_previous_message_id]
label = { zh = "缓存对比消息 ID", en = "Cache-compare message ID" }
desc = { zh = "填写已有 msg_… ID，诊断与该消息的缓存差异；moc 不自动维护此 ID。", en = "Fill in an existing msg_… ID to diagnose cache differences against it; moc does not maintain this ID." }

[core.params.tool_choice_type]
label = { zh = "工具选择策略", en = "Tool choice" }
desc = { zh = "auto 自动、none 禁用、any 必须调用、tool 指定函数；仅选择 moc 已提供的函数。", en = "auto picks automatically, none disables, any forces a call, tool pins a function; only choose among functions moc already provides." }

[core.params.tool_choice_name]
label = { zh = "指定函数名称", en = "Pinned function name" }
desc = { zh = "tool_choice.type 为 tool 时填写，例如 read；函数必须在本轮可用工具中。", en = "Fill in when tool_choice.type is tool, e.g. read; the function must be among this turn's available tools." }

[core.params.tool_choice_disable_parallel_tool_use]
label = { zh = "禁用并行工具调用", en = "Disable parallel tool use" }
desc = { zh = "true 每次最多调用一个工具，false 允许并行；并行兼容开关关闭时不发送此字段。", en = "true allows at most one tool call per request, false allows parallel; not sent when the parallel-compat switch is off." }

[core.params.anthropic-version]
label = { zh = "Anthropic API 版本", en = "Anthropic API version" }
desc = { zh = "使用的 API 版本，例如 2023-06-01；留空使用 moc 的协议版本。", en = "API version to use, e.g. 2023-06-01; empty uses moc's protocol version." }

[core.params.anthropic-beta]
label = { zh = "Anthropic 实验功能", en = "Anthropic beta features" }
desc = { zh = "逗号分隔的 beta 功能名，例如 fast-mode-2026-02-01；需模型和账号支持。", en = "Comma-separated beta feature names, e.g. fast-mode-2026-02-01; requires model and account support." }

[core.params.anthropic-workspace-id]
label = { zh = "Anthropic 工作区 ID", en = "Anthropic workspace ID" }
desc = { zh = "多工作区凭据使用的工作区，例如 wrkspc_…；必须与凭据权限匹配。", en = "Workspace for multi-workspace credentials, e.g. wrkspc_…; must match the credential's permissions." }

[core.params.anthropic-user-profile-id]
label = { zh = "Anthropic 用户档案 ID", en = "Anthropic user profile ID" }
desc = { zh = "代其他主体请求时用于归属标识；不要填写不必要的个人信息。", en = "Attribution ID when requesting on behalf of another party; don't put unnecessary personal info." }

[core.params.OpenAI-Organization]
label = { zh = "OpenAI 组织 ID", en = "OpenAI organization ID" }
desc = { zh = "为多组织凭据选择组织；必须与密钥权限匹配。", en = "Pick the organization for multi-org credentials; must match the key's permissions." }

[core.params.OpenAI-Project]
label = { zh = "OpenAI 项目 ID", en = "OpenAI project ID" }
desc = { zh = "为凭据选择上游项目；必须与密钥权限匹配。", en = "Pick the upstream project for the credential; must match the key's permissions." }

