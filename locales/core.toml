[core.config.keys.keep_last_prompts]
label = { zh = "Protect Recent Turns", en = "Protect Recent Turns" }
desc = { zh = "最近这些用户轮次内的工具结果不会被硬清理。", en = "Tool results within the most recent N user turns are never hard-cleared." }

[core.config.keys.supersede_reads]
label = { zh = "Supersede Old Reads", en = "Supersede Old Reads" }
desc = { zh = "同一文件被重新读取后，自动清理更早的读取结果。", en = "Automatically clear older read results once the same file is read again." }

[core.config.keys.max_length_continues]
label = { zh = "Max Cutoff Continues", en = "Max Cutoff Continues" }
desc = { zh = "回复因输出上限截断后自动续写的最大次数。", en = "Maximum automatic continuations after a response hits the output limit." }

[core.config.keys.loop_detection]
label = { zh = "Loop Detection", en = "Loop Detection" }
desc = { zh = "检测 thinking、正文与工具参数中出现的重复死循环。", en = "Detect repetition loops in thinking, body text, and tool arguments." }

[core.config.keys.connect_deadline_secs]
label = { zh = "Connect Deadline (s)", en = "Connect Deadline (s)" }
desc = { zh = "流式请求收到响应头前或非流式全流程的硬超时（秒）；流式生成阶段不限时。", en = "Hard timeout in seconds before response headers for streaming, or for the entire non-streaming request (streaming itself is unbounded)." }

[core.config.keys.request_warn_secs]
label = { zh = "Slow-Request Warn (s)", en = "Slow-Request Warn (s)" }
desc = { zh = "单次请求耗时超过该秒数时发出慢响应提醒，不中断请求。", en = "Emit a slow-request notice after this many seconds without cancelling the request." }

[core.config.keys.max_scan_entries]
label = { zh = "Max Scan Entries", en = "Max Scan Entries" }
desc = { zh = "find 工具单次查找最多扫描的条目数。", en = "Maximum entries scanned per find call." }

[core.config.keys.url]
label = { zh = "URL", en = "URL" }
desc = { zh = "远程 MCP 服务的 HTTP 地址。", en = "HTTP endpoint of a remote MCP server." }

[core.config.keys.compress]
label = { zh = "Compress Logs", en = "Compress Logs" }
desc = { zh = "新 session 以 zstd 格式保存（.jsonl.zst）；读取自动兼容未压缩历史。", en = "Store new sessions compressed with zstd (.jsonl.zst); uncompressed history still reads seamlessly." }

[core.config.keys.dir]
label = { zh = "Session Dir", en = "Session Dir" }
desc = { zh = "session 历史与运行记录的存储目录（重启生效）。", en = "Directory where session history and run records are stored (applies after restart)." }

[core.config.keys.artifacts_days]
label = { zh = "Artifact Retention (days)", en = "Artifact Retention (days)" }
desc = { zh = "超过该天数且无引用的临时产物可被清理。", en = "Unreferenced temporary artifacts older than this many days may be cleaned." }

[core.config.keys.logs_days]
label = { zh = "Job Log Retention (days)", en = "Job Log Retention (days)" }
desc = { zh = "超过该天数的任务日志可被清理。", en = "Job logs older than this many days may be cleaned." }

[core.config.keys.command]
label = { zh = "Command", en = "Command" }
desc = { zh = "stdio 模式下运行的本地可执行程序。", en = "Local executable launched in stdio mode." }

[core.config.keys.args]
label = { zh = "Args", en = "Args" }
desc = { zh = "逐行填写命令行参数。", en = "One command-line argument per line." }

[core.config.keys.env]
label = { zh = "Env", en = "Env" }
desc = { zh = "JSON 键值对，附加到该进程的运行环境。", en = "JSON key-value pairs added to the process environment." }

[core.config.keys.cwd]
label = { zh = "Working Dir", en = "Working Dir" }
desc = { zh = "MCP 进程的工作目录。", en = "Working directory of the MCP process." }

[core.config.keys.type]
label = { zh = "Transport", en = "Transport" }
desc = { zh = "stdio 为本地进程，http 为远程服务。", en = "stdio runs a local process; http connects to a remote service." }

[core.config.keys.allow]
label = { zh = "Tool Allowlist", en = "Tool Allowlist" }
desc = { zh = "逐行填写允许暴露的工具名，支持 * 通配；留空表示不限制。", en = "One tool name per line allowed to be exposed (* wildcards supported); empty means unrestricted." }

[core.config.keys.deny]
label = { zh = "Tool Denylist", en = "Tool Denylist" }
desc = { zh = "逐行填写禁用的工具名，支持 * 通配。", en = "One tool name per line to disable (* wildcards supported)." }

[core.config.keys.supports_stop]
label = { zh = "supports_stop", en = "supports_stop" }
desc = { zh = "关闭后不发送 `stop` / `stop_sequences`，包括 extra_body 中的设置。", en = "When off, neither `stop`/`stop_sequences` nor matching fields in extra_body are sent." }

[core.config.keys.supports_prompt_cache_key]
label = { zh = "supports_prompt_cache_key", en = "supports_prompt_cache_key" }
desc = { zh = "关闭后不发送 `prompt_cache_key`、`prompt_cache_options` 与 `prompt_cache_retention`。", en = "When off, `prompt_cache_key`, `prompt_cache_options`, and `prompt_cache_retention` are not sent." }

[core.config.keys.max_output_tokens_field]
label = { zh = "max_output_tokens_field", en = "max_output_tokens_field" }
desc = { zh = "Chat 使用 `max_tokens` 或 `max_completion_tokens`；不影响 Responses 与 Anthropic。", en = "Field name used by Chat (`max_tokens` or `max_completion_tokens`); Responses and Anthropic are unaffected." }

[core.config.keys.reasoning_field]
label = { zh = "reasoning_field", en = "reasoning_field" }
desc = { zh = "回传 thinking 内容时使用的 JSON 字段名。", en = "JSON field name used when echoing thinking content." }

[core.config.keys.reasoning_field_aliases]
label = { zh = "reasoning_field_aliases", en = "reasoning_field_aliases" }
desc = { zh = "逐行填写解析响应 thinking 内容时识别的字段别名。", en = "One field alias per line recognized when parsing thinking content from responses." }

[core.config.keys.tool_choice_dialect]
label = { zh = "tool_choice_dialect", en = "tool_choice_dialect" }
desc = { zh = "按网关兼容性选择标准发送、将 required 改写为 any 或不发送。", en = "Choose standard, rewrite required as any, or omit per gateway compatibility." }

[core.config.keys.parallel_tool_calls]
label = { zh = "parallel_tool_calls", en = "parallel_tool_calls" }
desc = { zh = "标识上游 API 是否支持 parallel_tool_calls。", en = "Whether the upstream API supports parallel_tool_calls." }

[core.config.keys.developer_role]
label = { zh = "developer_role", en = "developer_role" }
desc = { zh = "关闭后将 developer 消息降级为 system 角色发送。", en = "When off, developer messages are downgraded to the system role." }

[core.config.keys.response_format_dialect]
label = { zh = "response_format_dialect", en = "response_format_dialect" }
desc = { zh = "结构化输出 response_format 的协议兼容模式。", en = "Compatibility mode for structured-output response_format." }

[core.config.keys.echo_reasoning]
label = { zh = "echo_reasoning", en = "echo_reasoning" }
desc = { zh = "多轮工具调用时是否按协议回传历史 thinking 内容。", en = "Whether historical thinking content is echoed back during multi-turn tool calls." }

[core.config.keys.requires_reasoning_content_for_tool_calls]
label = { zh = "requires_reasoning_content_for_tool_calls", en = "requires_reasoning_content_for_tool_calls" }
desc = { zh = "发送含工具调用的历史消息时强制保留 thinking 内容字段。", en = "Always include the reasoning field on historical messages containing tool calls." }

[core.config.keys.requires_reasoning_content_for_all_assistant_turns]
label = { zh = "requires_reasoning_content_for_all_assistant_turns", en = "requires_reasoning_content_for_all_assistant_turns" }
desc = { zh = "所有历史 assistant 消息均强制携带 thinking 内容字段。", en = "Always include the reasoning field on every historical assistant message." }

[core.config.keys.requires_assistant_content_for_tool_calls]
label = { zh = "requires_assistant_content_for_tool_calls", en = "requires_assistant_content_for_tool_calls" }
desc = { zh = "包含工具调用的历史消息强制携带非空 content 字段。", en = "Always include non-empty content on historical messages containing tool calls." }

[core.config.keys.toggle_field]
label = { zh = "toggle_field", en = "toggle_field" }
desc = { zh = "请求体中控制 thinking 开关的字段名；留空不发送。", en = "Request-body field toggling thinking; empty means omitted." }

[core.config.keys.enabled_value]
label = { zh = "enabled_value", en = "enabled_value" }
desc = { zh = "请求体中表示开启 thinking 的字段值。", en = "Field value enabling thinking in the request body." }

[core.config.keys.disabled_value]
label = { zh = "disabled_value", en = "disabled_value" }
desc = { zh = "请求体中表示关闭 thinking 的字段值。", en = "Field value disabling thinking in the request body." }

[core.config.keys.effort_field]
label = { zh = "effort_field", en = "effort_field" }
desc = { zh = "请求体中控制 thinking effort 的字段名；留空不发送。", en = "Request-body field controlling thinking effort; empty means omitted." }

[core.config.keys.effort_map]
label = { zh = "effort_map", en = "effort_map" }
desc = { zh = "将 thinking 等级映射为上游 API 接受的值；未配置项原样发送。", en = "Map thinking levels to upstream-accepted values; unmapped levels are sent as-is." }

[core.config.keys.toggle_extra]
label = { zh = "toggle_extra", en = "toggle_extra" }
desc = { zh = "JSON 对象：合并到 thinking 开关对象中的附加字段。", en = "JSON object merged into the thinking-toggle object." }

[core.config.keys.language]
label = { zh = "Language", en = "Language" }
desc = { zh = "auto 跟随系统环境；zh/en 强制指定界面语言，重启前端进程后生效。", en = "auto follows the system locale; zh/en force a language and apply after restarting the frontend." }

# ---- 请求参数（parameters.rs）：label 直接使用精确 wire API 键名，此处仅维护双语 desc ----

[core.params]
invalid_value = { zh = "%{label}.%{name} 的值或类型无效：%{desc}", en = "%{label}.%{name} has an invalid value or type: %{desc}" }
invalid_effort = { zh = "%{label}.%{effort} 须为小写 thinking 等级名", en = "%{label}.%{effort} requires a lowercase thinking-level name" }
invalid_stop = { zh = "%{label}.%{name} 须为字符串数组；stop 也接受单个字符串，最多 4 项", en = "%{label}.%{name} requires a string array; stop also accepts a single string, up to 4 items" }

[core.params.temperature]
desc = { zh = "采样温度：越低越确定，越高越随机；仅支持此参数的 model 可用，通常与 top_p 二选一。", en = "Sampling temperature: lower is more deterministic, higher more random; only for models supporting it, usually chosen instead of top_p." }

[core.params.top_p]
desc = { zh = "核采样比例：仅从累计概率达到此值的候选中采样；通常与 temperature 二选一。", en = "Nucleus sampling: sample only from candidates up to this cumulative probability; usually chosen instead of temperature." }

[core.params.store]
desc = { zh = "控制上游是否保存请求与响应（可能涉及数据留存）；Chat 默认 false，Responses 默认 true。", en = "Whether the upstream stores requests and responses (may involve data retention); defaults to false on Chat and true on Responses." }

[core.params.metadata]
desc = { zh = "附加键值元数据；最多 16 项，键不超过 64 字符，值不超过 512 字符，勿填敏感信息。", en = "Extra key-value metadata; up to 16 entries, keys <= 64 chars, values <= 512 chars. Do not include sensitive data." }

[core.params.user]
desc = { zh = "旧版用户标识（已弃用）；优先使用 safety_identifier 与 prompt_cache_key，勿填姓名或邮箱。", en = "Legacy user ID (deprecated); prefer safety_identifier and prompt_cache_key. Do not enter names or emails." }

[core.params.safety_identifier]
desc = { zh = "用于上游滥用检测的稳定标识，最长 128 字符；建议使用不可逆哈希。", en = "Stable ID for upstream abuse detection, up to 128 chars; an irreversible hash is recommended." }

[core.params.service_tier]
desc = { zh = "选择处理速度与计费档位；需 model 与账号支持。session 开启 Fast Mode 时优先使用 fast。", en = "Processing speed and billing tier; requires model and account support. Session Fast Mode takes precedence with fast." }

[core.params.parallel_tool_calls]
desc = { zh = "允许单次请求并发调用多个工具；协议兼容开关关闭时不发送此字段。", en = "Allow multiple tool calls per request; omitted when the protocol-compat switch is off." }

[core.params.prompt_cache_key]
desc = { zh = "覆盖 moc 默认的 session cache 路由键，使相同前缀复用同一缓存路由。", en = "Override moc's default session cache key so identical prefixes share a cache route." }

[core.params.prompt_cache_options_mode]
desc = { zh = "cache 匹配模式：implicit 自动选择前缀；explicit 仅使用显式断点，无断点时不缓存。", en = "Cache matching mode: implicit chooses prefixes automatically; explicit uses only explicit breakpoints." }

[core.params.prompt_cache_options_ttl]
desc = { zh = "cache 最短存活时间：30m 为 30 分钟；Responses 另支持 12h（12 小时），视上游支持而定。", en = "Minimum cache TTL: 30m for 30 minutes; Responses also supports 12h (12 hours), subject to upstream support." }

[core.params.prompt_cache_retention]
desc = { zh = "旧版 cache 保留策略（已弃用）：in_memory 使用内存缓存，24h 延长保留；优先使用 prompt_cache_options.ttl。", en = "Legacy cache retention (deprecated): in_memory caches in memory, 24h extends retention; prefer prompt_cache_options.ttl." }

[core.params.stream_options_include_obfuscation]
desc = { zh = "流式传输随机填充以减少侧信道泄露；关闭可节省带宽，但会降低此项防护。", en = "Add random padding to streams to reduce side-channel leakage; disabling saves bandwidth at the cost of this protection." }

[core.params.top_logprobs]
desc = { zh = "每个位置返回 0–20 个候选 token 概率；Chat 还需开启 logprobs。moc 不单独展示概率表。", en = "Return 0–20 candidate token log probabilities per position; Chat also requires logprobs. moc does not render a probability table." }

[core.params.moderation_model]
desc = { zh = "审核输入与输出使用的 model（如 omni-moderation-latest）；需上游支持。", en = "Model used to moderate input and output (e.g. omni-moderation-latest); requires upstream support." }

[core.params.moderation_policy_input_mode]
desc = { zh = "输入审核策略：score 仅评分，block 拦截违规输入。", en = "Input moderation policy: score rates only, block rejects violating input." }

[core.params.moderation_policy_output_mode]
desc = { zh = "输出审核策略：score 仅评分，block 拦截违规输出。", en = "Output moderation policy: score rates only, block rejects violating output." }

[core.params.tool_choice]
desc = { zh = "工具选择策略 JSON：\"auto\" 自动、\"none\" 禁用、\"required\" 必调；指定函数时 Chat 用 {\"type\":\"function\",\"function\":{\"name\":\"read\"}}，Responses 用 {\"type\":\"function\",\"name\":\"read\"}。", en = "Tool choice JSON: \"auto\", \"none\", or \"required\"; for a pinned function Chat uses {\"type\":\"function\",\"function\":{\"name\":\"read\"}}, Responses uses {\"type\":\"function\",\"name\":\"read\"}." }

[core.params.frequency_penalty]
desc = { zh = "重复频率惩罚（-2 至 2）：正值抑制重复词句，负值增强重复倾向。", en = "Frequency penalty (-2 to 2): positive reduces repeated phrases, negative encourages them." }

[core.params.presence_penalty]
desc = { zh = "重复主题惩罚（-2 至 2）：正值鼓励新话题，负值倾向延续已有话题。", en = "Presence penalty (-2 to 2): positive encourages new topics, negative sticks to existing ones." }

[core.params.logit_bias]
desc = { zh = "token 概率偏置 JSON：将 token ID 映射到 -100 至 100 的偏置值，例如 {\"123\":-10}。", en = "Token logit bias JSON mapping token IDs to values in -100..100, e.g. {\"123\":-10}." }

[core.params.logprobs]
desc = { zh = "请求返回输出 token 的对数概率；moc 不单独展示概率表。", en = "Request output-token log probabilities; moc does not render a probability table." }

[core.params.n]
desc = { zh = "生成候选数量（1–128）；moc 仅消费首个候选，其余仍计费，通常保持 1。", en = "Number of completions to generate (1–128); moc consumes only the first while the rest still bill — usually keep 1." }

[core.params.seed]
desc = { zh = "采样随机种子（有符号整数）；相同种子尽力保持一致，不保证严格确定性。", en = "Signed integer sampling seed; best-effort consistency only, not strictly deterministic." }

[core.params.reasoning_effort]
desc = { zh = "默认 thinking effort：none 关闭，或填写 minimal、low、medium、high、xhigh、max 及自定义等级；session 显式选择优先，须位于 model 的 thinking_levels 中。", en = "Default thinking effort: none disables, or use minimal/low/medium/high/xhigh/max or a custom level; explicit session choices win and the level must be in thinking_levels." }

[core.params.verbosity]
desc = { zh = "回复详细程度：low 更简洁，medium 适中，high 更详尽；仅支持此参数的 model 可用。", en = "Response verbosity: low is terser, medium balanced, high more detailed; only on models supporting it." }

[core.params.stop]
desc = { zh = "停止序列（JSON 字符串或最多 4 项字符串数组）；保留逗号与换行，命中即停止生成。部分推理 model 不支持。", en = "Stop sequences (JSON string or array of up to 4 strings); commas and newlines preserved, stops on match. Unsupported by some reasoning models." }

[core.params.stream_options_include_usage]
desc = { zh = "流式响应末尾附带 token 用量统计；moc 默认 true，关闭后可能缺少准确用量与费用。", en = "Include token usage at the end of streamed responses; moc defaults to true, disabling may lose accurate usage and cost." }

[core.params.prediction_type]
desc = { zh = "预期输出类型，固定为 content；仅支持 Predicted Outputs 的 model 可用。", en = "Predicted output type, fixed to content; only on models supporting Predicted Outputs." }

[core.params.prediction_content]
desc = { zh = "预期输出内容（JSON 字符串或文本块数组），用于大部分输出已知的场景；会发送至上游。", en = "Predicted output content (JSON string or array of text blocks) when most output is known; sent upstream." }

[core.params.response_format_type]
desc = { zh = "响应格式：text 普通文本、json_object JSON 对象、json_schema 按 schema 输出；JSON 模式需在 prompt 中说明。", en = "Response format: text, json_object, or json_schema; JSON modes require describing the format in the prompt." }

[core.params.response_format_json_schema_name]
desc = { zh = "JSON Schema 名称，最长 64 字符，仅允许字母、数字、下划线与连字符。", en = "JSON Schema name, up to 64 chars: letters, digits, underscores, and hyphens only." }

[core.params.response_format_json_schema_description]
desc = { zh = "解释该输出结构的用途，帮助 model 理解预期格式。", en = "Explain this schema's purpose so the model understands the expected output." }

[core.params.response_format_json_schema_schema]
desc = { zh = "定义预期输出结构的 JSON Schema 对象，例如 {\"type\":\"object\",\"properties\":{}}。", en = "JSON Schema object defining the expected output structure, e.g. {\"type\":\"object\",\"properties\":{}}." }

[core.params.response_format_json_schema_strict]
desc = { zh = "开启后严格遵循 schema；仅支持上游允许的 JSON Schema 子集。", en = "When on, strictly enforce the schema; limited to the upstream-supported JSON Schema subset." }

[core.params.reasoning_summary]
desc = { zh = "thinking 摘要粒度：auto 自动、concise 简洁、detailed 详尽；moc 默认 auto，关闭 thinking 时不发送。", en = "Reasoning summary detail: auto, concise, or detailed; moc defaults to auto and omits it when thinking is off." }

[core.params.reasoning_generate_summary]
desc = { zh = "旧版 thinking 摘要参数（已弃用）；优先使用 reasoning.summary，仅在未配置 summary 时生效。", en = "Legacy reasoning summary parameter (deprecated); prefer reasoning.summary — used only when summary is unset." }

[core.params.reasoning_context]
desc = { zh = "历史 thinking 上下文范围：auto 自动、current_turn 仅当前轮、all_turns 全部轮次。", en = "Historical reasoning context scope: auto, current_turn, or all_turns." }

[core.params.reasoning_mode]
desc = { zh = "thinking 执行模式（如 standard 或 pro）；原样发送，是否支持取决于 model 与上游。", en = "Reasoning execution mode (e.g. standard or pro); sent as-is, support depends on the model and upstream." }

[core.params.text_verbosity]
desc = { zh = "回复详细程度：low 更简洁，medium 适中，high 更详尽；与 reasoning.summary 粒度无关。", en = "Response verbosity: low, medium, or high; independent of reasoning.summary detail." }

[core.params.text_format_type]
desc = { zh = "输出格式：text 普通文本、json_object JSON 对象、json_schema 按 schema 输出；JSON 模式需在 prompt 中说明。", en = "Output format: text, json_object, or json_schema; JSON modes require describing the format in the prompt." }

[core.params.text_format_name]
desc = { zh = "JSON Schema 名称，最长 64 字符，仅允许字母、数字、下划线与连字符。", en = "JSON Schema name, up to 64 chars: letters, digits, underscores, and hyphens only." }

[core.params.text_format_description]
desc = { zh = "解释该输出结构的用途，帮助 model 理解预期格式。", en = "Explain this schema's purpose so the model understands the expected output." }

[core.params.text_format_schema]
desc = { zh = "定义预期输出结构的 JSON Schema 对象。", en = "JSON Schema object defining the expected output structure." }

[core.params.text_format_strict]
desc = { zh = "开启后严格遵循 schema；仅支持上游允许的 JSON Schema 子集。", en = "When on, strictly enforce the schema; limited to the upstream-supported JSON Schema subset." }

[core.params.include]
desc = { zh = "附加返回字段列表（如 message.output_text.logprobs、message.input_image.image_url）；moc 会按回传策略自动追加 reasoning.encrypted_content。", en = "Extra returned fields (e.g. message.output_text.logprobs, message.input_image.image_url); moc appends reasoning.encrypted_content per the echo policy." }

[core.params.truncation]
desc = { zh = "上游超长输入处理策略：disabled 超长报错；auto 允许上游丢弃开头历史（可能丢失早期指令）。", en = "Upstream over-length handling: disabled errors; auto lets the upstream drop earliest history (may lose early instructions)." }

[core.params.prompt_id]
desc = { zh = "引用已在上游创建的 prompt 模板 ID；模板可能改写请求指令。", en = "Reference an upstream prompt template ID; the template may alter request instructions." }

[core.params.prompt_version]
desc = { zh = "指定 prompt 模板版本；留空使用上游默认版本。", en = "Pin a prompt template version; empty uses the upstream default." }

[core.params.prompt_variables]
desc = { zh = "prompt 模板变量 JSON 对象：将变量名映射为字符串或文本/图片输入对象。", en = "JSON object mapping prompt template variable names to strings or text/image input objects." }

[core.params.prompt_cache_options_comparison_response_id]
desc = { zh = "填写已有响应 ID，请求上游诊断与该响应的 cache 差异；moc 不自动维护此 ID。", en = "Existing response ID used to ask the upstream to diagnose cache differences against it; moc does not track this ID." }

[core.params.image_context_compression]
desc = { zh = "上游图片上下文压缩：auto 自动、enabled 强制要求支持、disabled 关闭；不改变 moc 本地图片预算。", en = "Upstream image context compression: auto, enabled (required), or disabled; does not alter moc's local image budget." }

[core.params.access_programs_cyber]
desc = { zh = "Cyber 访问计划（standard / daybreak_blue / daybreak_red）；需账号与 model 授权，否则上游拒绝。", en = "Cyber access program (standard, daybreak_blue, or daybreak_red); requires account and model authorization." }

[core.params.top_k]
desc = { zh = "仅从概率最高的 K 个候选中采样；仅向支持此参数的 model 发送。", en = "Sample only from the K most likely candidates; sent only to models supporting it." }

[core.params.stop_sequences]
desc = { zh = "停止序列字符串数组；使用 JSON 数组可精确保留逗号与换行，命中即停止生成。", en = "Array of stop sequences; JSON array preserves commas and newlines exactly, stopping on match." }

[core.params.thinking_type]
desc = { zh = "thinking 模式：adaptive 自适应、enabled 固定预算、disabled 关闭、between_tools 工具间思考；session 选 off 时优先，取值需 model 支持。", en = "Thinking mode: adaptive, enabled (budgeted), disabled, or between_tools; session off wins and value must be supported by the model." }

[core.params.thinking_budget_tokens]
desc = { zh = "thinking token 预算：enabled 模式下至少 1024，且须小于 Max Output Tokens；预算计入 max_tokens。", en = "Thinking token budget: at least 1024 in enabled mode and below Max Output Tokens; counts toward max_tokens." }

[core.params.thinking_display]
desc = { zh = "thinking 返回方式：summarized 返回摘要，omitted 隐藏正文但保留签名；moc 默认 summarized。", en = "Thinking display mode: summarized returns a summary, omitted hides text while keeping signatures; moc defaults to summarized." }

[core.params.output_config_effort]
desc = { zh = "默认 thinking effort（low / medium / high / xhigh / max 或自定义等级）；session 显式选择优先。enabled + budget_tokens 模式下直接使用此值。", en = "Default thinking effort (low/medium/high/xhigh/max or custom); explicit session choices win. Used directly under enabled + budget_tokens." }

[core.params.output_config_format_type]
desc = { zh = "结构化输出类型，固定为 json_schema。", en = "Structured output type, fixed to json_schema." }

[core.params.output_config_format_schema]
desc = { zh = "定义预期输出结构的 JSON Schema 对象。", en = "JSON Schema object defining the expected output structure." }

[core.params.metadata_user_id]
desc = { zh = "外部用户标识：请使用 UUID、哈希或其他不透明 ID，勿发送姓名、邮箱或手机号等个人信息。", en = "External user ID: use a UUID, hash, or opaque ID; do not send personal info such as names, emails, or phone numbers." }

[core.params.anthropic.service_tier]
desc = { zh = "服务容量档位：auto 可用优先容量，standard_only 仅用标准容量；需账号支持。", en = "Service capacity tier: auto may use prioritized capacity, standard_only sticks to standard; requires account support." }

[core.params.speed]
desc = { zh = "推理速度模式：standard 标准、fast 高速；部分 model 需在 anthropic-beta 中添加 fast-mode-2026-02-01。", en = "Inference speed mode: standard or fast; some models require fast-mode-2026-02-01 in anthropic-beta." }

[core.params.inference_geo]
desc = { zh = "指定上游推理区域；留空使用 workspace 默认区域，需账号支持。", en = "Pin the upstream inference region; empty uses the workspace default and requires account support." }

[core.params.cache_control_type]
desc = { zh = "自动 cache 类型，固定为 ephemeral，让上游在最后一个可缓存块设置断点；可与 moc 显式断点共存。", en = "Auto cache type, fixed to ephemeral so the upstream places a breakpoint on the last cacheable block; coexists with moc's explicit breakpoints." }

[core.params.cache_control_ttl]
desc = { zh = "自动 cache 存活时间：5m 为 5 分钟，1h 为 1 小时；更长缓存可能影响计费。", en = "Auto cache TTL: 5m for 5 minutes, 1h for 1 hour; longer caching may affect billing." }

[core.params.diagnostics_previous_message_id]
desc = { zh = "填写已有 msg_… ID，用于诊断与该消息的 cache 差异；moc 不自动维护此 ID。", en = "Existing msg_… ID used to diagnose cache differences against that message; moc does not track this ID." }

[core.params.tool_choice_type]
desc = { zh = "工具选择策略：auto 自动、none 禁用、any 必调、tool 指定函数；仅可选 moc 已提供的函数。", en = "Tool choice mode: auto, none, any (force a call), or tool (pin a function); choose only among functions moc provides." }

[core.params.tool_choice_name]
desc = { zh = "当 tool_choice.type 为 tool 时填写目标函数名（如 read）；须属于本轮可用工具。", en = "Target function name when tool_choice.type is tool (e.g. read); must be among this turn's available tools." }

[core.params.tool_choice_disable_parallel_tool_use]
desc = { zh = "true 每次最多调用一个工具，false 允许并行；并行兼容开关关闭时不发送此字段。", en = "true allows at most one tool call per request, false allows parallel; omitted when the parallel-compat switch is off." }

[core.params.anthropic-version]
desc = { zh = "Anthropic API 版本头（如 2023-06-01）；留空使用 moc 默认协议版本。", en = "Anthropic API version header (e.g. 2023-06-01); empty uses moc's default protocol version." }

[core.params.anthropic-beta]
desc = { zh = "逗号分隔的 Anthropic beta 特性名（如 fast-mode-2026-02-01）；需 model 与账号支持。", en = "Comma-separated Anthropic beta feature flags (e.g. fast-mode-2026-02-01); requires model and account support." }

[core.params.anthropic-workspace-id]
desc = { zh = "多 workspace 凭据使用的目标 workspace（如 wrkspc_…）；须与 API Key 权限匹配。", en = "Target workspace for multi-workspace credentials (e.g. wrkspc_…); must match the API Key permissions." }

[core.params.anthropic-user-profile-id]
desc = { zh = "代其他主体发起请求时的归属标识；勿填写非必要的个人信息。", en = "Attribution ID when requesting on behalf of another party; avoid unnecessary personal info." }

[core.params.OpenAI-Organization]
desc = { zh = "为多组织凭据指定 OpenAI 组织 ID；须与 API Key 权限匹配。", en = "OpenAI organization ID for multi-org credentials; must match the API Key permissions." }

[core.params.OpenAI-Project]
desc = { zh = "为凭据指定上游 OpenAI 项目 ID；须与 API Key 权限匹配。", en = "Upstream OpenAI project ID for the credential; must match the API Key permissions." }

# ---- 空闲 Tips（initialize 下发至 TUI / Web）----

[core.tips]
tip_01 = { zh = "`!command` 的输出会进入对话并让 model 可见；`!!command` 仅在界面显示，不进入 context", en = "`!command` output enters the conversation for the model; `!!command` displays only in the UI and stays out of context" }
tip_02 = { zh = "生成中断或出错时，输入 `.` 或 `/retry` 即可原地继续，无需再发送「继续」", en = "When a generation is interrupted or fails, enter `.` or `/retry` to continue without sending another message" }
tip_03 = { zh = "Fusion 让前沿 model 规划与评审、高性价比 model 执行：配好 `models.fusion` 后选择 `fusion`", en = "Fusion pairs a frontier lead model with a fast sidekick: configure `models.fusion` and select `fusion`" }
tip_04 = { zh = "PTC 引擎通过脚本批量调用工具，适合多步查询与处理，显著减少往返轮次", en = "The PTC engine batches tool calls via scripts, cutting round trips on multi-step queries and edits" }
tip_05 = { zh = "session 引擎只能在发送首条消息前切换，首条消息后即随 session 锁定", en = "The session engine can only be switched before the first message; it locks once the session starts" }
tip_06 = { zh = "`/btw <question>` 可随时旁路提问，不打断主任务，也不写入 session 历史", en = "`/btw <question>` asks a quick side question without interrupting the main task or polluting session history" }
tip_07 = { zh = "`/ask <question>` 仅本轮以只读问答模式运行，不会改动任何文件", en = "`/ask <question>` handles only this turn in read-only Q&A mode without modifying files" }
tip_08 = { zh = "`/plan` 先拟定实施计划，经你审阅批准后再动手修改", en = "`/plan` drafts an implementation plan first and waits for your approval before making changes" }
tip_09 = { zh = "进入、退出或批准计划都会保持当前 model；如需切换请使用 `/model`", en = "Entering, exiting, or approving a plan keeps the current model; use `/model` to switch" }
tip_10 = { zh = "context 接近上限时可先执行 `/compact` 手动压缩，再开始下一阶段任务", en = "Run `/compact` when context gets full before starting the next phase of work" }
tip_11 = { zh = "`/usage` 查看当前 session 各 model 的调用次数、token、cache 命中与耗时", en = "`/usage` shows per-model calls, tokens, cache hits, and timing for this session" }
tip_12 = { zh = "`/context` 查看实际发送给 model 的内容：system prompt、工具定义与每条消息", en = "`/context` inspects what is actually sent to the model: system prompt, tool definitions, and every message" }
tip_13 = { zh = "`/autonomy` 调整自主级别：unattended 模式下自动回答提问，并自动批准执行计划", en = "`/autonomy` adjusts autonomy: unattended auto-answers questions and auto-approves submitted plans" }
tip_14 = { zh = "回复生成中发出的消息会直接补充进当前轮次，无需等待完成", en = "Messages sent while a reply is streaming steer the current turn directly without waiting" }
tip_15 = { zh = "在 model 配置中填写 `pricing`，即可显示单价与 session 费用估算", en = "Set `pricing` in a model config to show unit prices and estimated session cost" }
tip_16 = { zh = "在 model 配置中开启 `fast_mode = true`，model 选择器将显示 Fast Mode 开关", en = "Set `fast_mode = true` on a model to show a Fast Mode toggle in the model picker" }
tip_17 = { zh = "在消息中单独写 `@path/to/image.png`，可直接附带本地图片发给多模态 model", en = "Write `@path/to/image.png` on its own in a message to attach a local image for multimodal models" }
tip_18 = { zh = "放入项目 `.moc/plugins` 的 plugin 会自动加载，可扩展自定义工具与斜杠命令", en = "Plugins placed in `.moc/plugins` load automatically to add custom tools and slash commands" }
tip_19 = { zh = "CLM 实验引擎让 model 自主维护工作 context，不必等到上限再统一压缩", en = "The experimental CLM engine lets the model curate its working context continuously instead of waiting for compaction" }

