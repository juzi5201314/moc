[core.config.opt.language]
auto = { zh = "跟随系统", en = "Follow system" }
zh = { zh = "中文", en = "中文" }
en = { zh = "English", en = "English" }

[core.config.opt.api]
openai_chat = { zh = "OpenAI Chat", en = "OpenAI Chat" }
openai_responses = { zh = "OpenAI Responses", en = "OpenAI Responses" }
