short = { zh = "Short", en = "Short" }
long = { zh = "Long", en = "Long" }
off = { zh = "Off", en = "Off" }

[core.config.opt.overflow]
error = { zh = "Error", en = "Error" }
wait = { zh = "Wait", en = "Wait" }

[core.config.opt.motf]
max_tokens = { zh = "max_tokens", en = "max_tokens" }
max_completion_tokens = { zh = "max_completion_tokens", en = "max_completion_tokens" }

[core.config.opt.tool_choice]
standard = { zh = "Standard", en = "Standard" }
any_for_required = { zh = "any_for_required", en = "any_for_required" }
unsupported = { zh = "Unsupported", en = "Unsupported" }

[core.config.opt.echo_reasoning]
protocol = { zh = "Protocol default", en = "Protocol default" }
