_version = 2

# moc-core 用户面文案：zh 为源语言，en 为翻译。消息键 = 表路径。
# 给模型看的文本（prompt / reminder / 工具描述）不入此文件，按规则保持英文。

[core.config]
invalid_language = { zh = "language: 仅支持 auto、zh、en", en = "language: only auto, zh and en are supported" }
fallback_desc = { zh = "自定义配置项。", en = "Custom option." }
desc_fmt = { zh = "`%{name}`：%{desc}", en = "`%{name}`: %{desc}" }

[core.config.tabs]
models = { zh = "模型", en = "Models" }
providers = { zh = "供应商", en = "Providers" }
tools = { zh = "工具", en = "Tools" }
sandbox = { zh = "沙盒", en = "Sandbox" }
context = { zh = "上下文", en = "Context" }
instructions = { zh = "指令", en = "Instructions" }
skills = { zh = "技能", en = "Skills" }
mcp = { zh = "MCP", en = "MCP" }
plugins = { zh = "插件", en = "Plugins" }
