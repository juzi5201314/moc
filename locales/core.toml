_version = 2

# moc-core 用户面文案：zh 为源语言，en 为翻译。消息键 = 表路径。
# 给模型看的文本（prompt / reminder / 工具描述）不入此文件，按规则保持英文。

[core.config]
invalid_language = { zh = "language 仅支持 auto、zh、en", en = "language only supports auto, zh, and en" }
fallback_desc = { zh = "自定义配置项。", en = "Custom option." }
desc_fmt = { zh = "`%{name}`：%{desc}", en = "`%{name}`: %{desc}" }

[core.config.tabs]
models = { zh = "Models", en = "Models" }
providers = { zh = "Providers", en = "Providers" }
tools = { zh = "Tools", en = "Tools" }
sandbox = { zh = "Sandbox", en = "Sandbox" }
context = { zh = "Context", en = "Context" }
instructions = { zh = "Instructions", en = "Instructions" }
skills = { zh = "Skills", en = "Skills" }
mcp = { zh = "MCP", en = "MCP" }
