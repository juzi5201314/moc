deny = { zh = "直接拒绝", en = "Deny outright" }

[core.config.opt.model_input]
text = { zh = "仅文本 (text)", en = "Text only (text)" }
text_image = { zh = "文本与图片 / 多模态 (text, image)", en = "Text and images / multimodal (text, image)" }

[core.config.fields.features_clm]
label = { zh = "CLM 引擎", en = "CLM engine" }
