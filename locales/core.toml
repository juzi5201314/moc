unsupported = { zh = "不发送", en = "Don't send" }

[core.config.opt.echo_reasoning]
protocol = { zh = "按协议默认", en = "Protocol default" }
always = { zh = "总是", en = "Always" }
never = { zh = "从不", en = "Never" }

[core.config.opt.threshold_mode]
