tokens = { zh = "按固定长度", en = "By fixed token count" }

[core.config.opt.compaction_method]
moc = { zh = "Moc（本地修剪 + 摘要）", en = "Moc (local trim + summary)" }
grok_build = { zh = "Grok Build", en = "Grok Build" }
eocc = { zh = "EoCC（实验性交接状态）", en = "EoCC (experimental handoff state)" }

[core.config.opt.sandbox_mode]
full = { zh = "full（无沙盒）", en = "full (no sandbox)" }
