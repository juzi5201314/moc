desc = { zh = "启用 PTC（Programmatic Tool Calling）模式：model 通过 execute sandbox 批量编排工具调用。", en = "Enable PTC (Programmatic Tool Calling): the model orchestrates tool calls via the execute sandbox." }

[core.config.fields.agents_max_depth]
