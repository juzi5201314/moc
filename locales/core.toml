desc = { zh = "Explore 角色使用的模型；inherit 沿用主模型，none 禁用。", en = "Model for the Explore role; inherit reuses the main model, none disables it." }

[core.config.fields.models_fusion_lead]
label = { zh = "Fusion Lead 模型", en = "Fusion Lead model" }
desc = { zh = "负责规划、调查与评审的主导模型（格式：供应商/模型[:等级]）。", en = "Lead model for planning, investigation and review (format: provider/model[:level])." }

[core.config.fields.models_fusion_sidekick]
label = { zh = "Fusion Sidekick 模型", en = "Fusion Sidekick model" }
desc = { zh = "负责具体实现与测试的执行模型（格式：供应商/模型[:等级]）。", en = "Execution model for implementation and testing (format: provider/model[:level])." }

[core.config.fields.context_files_enabled]
