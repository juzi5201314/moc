[core.config.opt.cache]
auto = { zh = "自动", en = "Auto" }
short = { zh = "短缓存", en = "Short-lived" }
long = { zh = "长缓存", en = "Long-lived" }
off = { zh = "不缓存", en = "Off" }

[core.config.opt.overflow]
error = { zh = "直接报错", en = "Fail immediately" }
wait = { zh = "等待空位", en = "Wait for a slot" }

[core.config.opt.motf]
max_tokens = { zh = "max_tokens", en = "max_tokens" }
