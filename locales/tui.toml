[tui.settings]
thinking_detail = { zh = "Thinking Detail", en = "Thinking Detail" }
thinking_detail_desc = { zh = "`thinking_detail`：hidden 仅显示耗时；brief 预览末尾数行；full 展开完整思考过程。", en = "`thinking_detail`: hidden shows duration only; brief previews trailing lines; full expands all thinking." }
tool_detail = { zh = "Tool Detail", en = "Tool Detail" }
tool_detail_desc = { zh = "`tool_detail`：hidden 仅显示标题；brief 展示简要预览；点击单条卡片可展开完整输出。", en = "`tool_detail`: hidden shows title only; brief shows a compact preview; click a card to expand full output." }
notify_complete = { zh = "Notify on Complete", en = "Notify on Complete" }
notify_complete_desc = { zh = "`notify_complete`：终端不在前台时，任务完成后发送桌面通知。", en = "`notify_complete`: Send a desktop notification when a task finishes while the terminal is unfocused." }
notify_waiting = { zh = "Notify on Waiting", en = "Notify on Waiting" }
notify_waiting_desc = { zh = "`notify_waiting`：终端不在前台时，需要授权或回答提问时发送桌面通知。", en = "`notify_waiting`: Send a desktop notification when authorization or an answer is needed while unfocused." }
active_submit = { zh = "Active Submit", en = "Active Submit" }
active_submit_desc = { zh = "`active_submit`：任务运行中按 Enter 的行为：steer 追加引导消息，或 interrupt 中断当前任务并重新提交。", en = "`active_submit`: Behavior of Enter while running: steer appends a steering message, or interrupt stops and resubmits." }
queue_on_enter = { zh = "Queue on Enter", en = "Queue on Enter" }
queue_on_enter_desc = { zh = "`queue_on_enter`：开启后任务运行中按 Enter 将消息排入队列，按 queue 键位（默认 Ctrl+Enter）则按 active_submit 补充或中断。", en = "`queue_on_enter`: When on, Enter queues the message while running and the queue key (Ctrl+Enter by default) steers or interrupts per active_submit." }
history_scope = { zh = "History Scope", en = "History Scope" }
history_scope_desc = { zh = "`history_scope`：↑/↓ 召回的输入历史范围：global 全局共享，或 project 仅限当前项目。", en = "`history_scope`: Scope of ↑/↓ input history recall: global across projects, or current project only." }
statusline = { zh = "Statusline", en = "Statusline" }
statusline_desc = { zh = "`statusline`：自定义状态栏模板，支持占位符：{model} {status} {workdir} {branch} {context} {context_percent} {todo} {tokens_in} {tokens_out} {tok_s} {prompt_elapsed} {cost}。", en = "`statusline`: Custom statusline template. Placeholders: {model} {status} {workdir} {branch} {context} {context_percent} {todo} {tokens_in} {tokens_out} {tok_s} {prompt_elapsed} {cost}." }
