_version = 2

[acp.mode]
default = { zh = "Ask", en = "Ask" }
default_desc = { zh = "需要决策时向你询问，计划交由你审阅", en = "Asks you when input is needed and lets you review plans" }
dont_ask = { zh = "Don't ask", en = "Don't ask" }
dont_ask_desc = { zh = "不再向你提问，自动采用推荐选项；计划仍交由你审阅", en = "Auto-answers questions with recommended options; plans still wait for review" }
unattended = { zh = "Unattended", en = "Unattended" }
unattended_desc = { zh = "自动应答提问，计划提交后自动压缩并执行", en = "Auto-answers questions and auto-approves submitted plans (compact and run)" }
plan = { zh = "Plan", en = "Plan" }
plan_desc = { zh = "先拟定实施计划，经你批准后再动手修改", en = "Draft an implementation plan first; writes and execution wait for approval" }

[acp.model]
context = { zh = "%{window} tokens context", en = "%{window} tokens context" }
label = { zh = "Model", en = "Model" }
desc = { zh = "当前会话使用的模型", en = "Model used by this session" }

[acp.diff]
truncated = { zh = "Diff 已截断，部分改动未显示。", en = "Diff truncated; some changes are not shown." }

[acp.plan]
blocked = { zh = "%{content} (blocked: %{reason})", en = "%{content} (blocked: %{reason})" }
approved = { zh = "Plan \"%{title}\" approved", en = "Plan \"%{title}\" approved" }
rejected = { zh = "Plan \"%{title}\" rejected", en = "Plan \"%{title}\" rejected" }
superseded = { zh = "Plan \"%{title}\" superseded by a newer version", en = "Plan \"%{title}\" superseded by a newer version" }
mismatch_row = { zh = "- %{field}：请求 %{requested}，上游返回 %{reported}", en = "- %{field}: requested %{requested}, upstream reported %{reported}" }

[acp.notice]
retry_title = { zh = "Auto retry", en = "Auto retry" }
retry_body = { zh = "本次生成之前的输出已丢弃，已完成的工具结果保留。%{message}", en = "Earlier output of this generation was discarded; completed tool results are kept. %{message}" }
guard_title = { zh = "Loop guard", en = "Loop guard" }
plugin_disabled = { zh = "Plugin %{plugin} 已停用", en = "Plugin %{plugin} disabled" }
mismatch_title = { zh = "上游生效配置与请求不一致", en = "Upstream differs from request" }
compacting = { zh = "Compacting context...", en = "Compacting context..." }
compacted = { zh = "Context 压缩完成：%{before} → %{after} tokens", en = "Context compaction done: %{before} → %{after} tokens" }
compact_failed = { zh = "Context 压缩失败", en = "Context compaction failed" }
error_title = { zh = "Prompt error", en = "Prompt error" }
code_message = { zh = "%{code}: %{message}", en = "%{code}: %{message}" }

[acp.err]
unknown_mode = { zh = "未知会话模式：%{mode}", en = "Unknown session mode: %{mode}" }
unsupported_config = { zh = "不支持的配置项：%{id}", en = "Unsupported config option: %{id}" }
need_value_id = { zh = "model 选项需要 value id", en = "The model option requires a value id" }
core_closed = { zh = "与后台服务的连接已断开", en = "Connection to the backend service closed" }
blob_unsupported = { zh = "不支持二进制嵌入资源；请以文本或图片发送", en = "Binary embedded resources are not supported; send text or images instead" }
resource_unsupported = { zh = "不支持该类型的嵌入资源", en = "Unsupported embedded resource type" }
content_unsupported = { zh = "不支持该类型的内容块", en = "Unsupported content block type" }
not_core = { zh = "连接到非 moc-core 服务：%{name}", en = "Connected to a non-moc-core service: %{name}" }
