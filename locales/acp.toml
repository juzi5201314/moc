_version = 2

[acp.mode]
default = { zh = "默认", en = "Ask" }
default_desc = { zh = "所有确认都等用户本人回答", en = "Every confirmation waits for your own answer" }
dont_ask = { zh = "免询问", en = "Don't ask" }
dont_ask_desc = { zh = "问题由代理代答：有推荐项选推荐项", en = "The agent answers questions itself: recommended option when available" }
unattended = { zh = "无人值守", en = "Unattended" }
unattended_desc = { zh = "在免询问之上，计划提交自动批准「压缩并执行」", en = "On top of don't-ask, plan submissions are auto-approved as “compact and run”" }
plan = { zh = "计划", en = "Plan" }
plan_desc = { zh = "先产出实施计划，批准后才允许写入与执行", en = "Produce an implementation plan first; writes and execution require approval" }

[acp.model]
context = { zh = "%{window} tokens 上下文", en = "%{window} tokens context" }
label = { zh = "模型", en = "Model" }
desc = { zh = "本次会话使用的模型", en = "Model used by this session" }

[acp.plan]
blocked = { zh = "%{content}（阻塞：%{reason}）", en = "%{content} (blocked: %{reason})" }
approved = { zh = "计划「%{title}」已批准", en = "Plan “%{title}” approved" }
rejected = { zh = "计划「%{title}」已拒绝", en = "Plan “%{title}” rejected" }
superseded = { zh = "计划「%{title}」已被新版本取代", en = "Plan “%{title}” superseded by a newer version" }
mismatch_row = { zh = "- %{field}：请求 %{requested}，上游实际 %{reported}", en = "- %{field}: requested %{requested}, upstream reported %{reported}" }

[acp.notice]
retry_title = { zh = "自动重试", en = "Auto retry" }
retry_body = { zh = "本次生成的先前输出作废，已完成的工具结果保留。%{message}", en = "Earlier output of this generation was discarded; completed tool results are kept. %{message}" }
guard_title = { zh = "循环守卫", en = "Loop guard" }
plugin_disabled = { zh = "插件 %{plugin} 已停用", en = "Plugin %{plugin} disabled" }
mismatch_title = { zh = "上游与请求不一致", en = "Upstream differs from request" }
compacting = { zh = "正在压缩上下文…", en = "Compacting context…" }
compacted = { zh = "上下文压缩完成：%{before} → %{after} tokens", en = "Context compaction done: %{before} → %{after} tokens" }
compact_failed = { zh = "上下文压缩失败", en = "Context compaction failed" }
error_title = { zh = "提示错误", en = "Prompt error" }
code_message = { zh = "%{code}：%{message}", en = "%{code}: %{message}" }

[acp.err]
unknown_mode = { zh = "未知会话模式 %{mode}", en = "Unknown session mode %{mode}" }
unsupported_config = { zh = "不支持的配置项 %{id}", en = "Unsupported config option %{id}" }
need_value_id = { zh = "model 选项需要 value id", en = "The model option requires a value id" }
core_closed = { zh = "与 core 的连接已关闭", en = "Connection to core closed" }
blob_unsupported = { zh = "不支持二进制嵌入资源；请以文本或图片发送", en = "Binary embedded resources are not supported; send text or images instead" }
resource_unsupported = { zh = "不支持该类型的嵌入资源", en = "Unsupported embedded resource type" }
content_unsupported = { zh = "不支持该类型的内容块", en = "Unsupported content block type" }
not_core = { zh = "连接到非 moc-core 服务：%{name}", en = "Connected to a non-moc-core service: %{name}" }
