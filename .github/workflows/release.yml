name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name used in asset names (optional)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64-musl
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - name: windows-x86_64-msvc
            os: windows-latest
            target: x86_64-pc-windows-msvc
    env:
      TARGET: ${{ matrix.target }}
      PLATFORM: ${{ matrix.name }}
      VERSION: ${{ github.event.release.tag_name || github.event.inputs.tag || 'dev' }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          cache-on-failure: true

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools nasm

      - name: Set up mold linker
        if: runner.os == 'Linux'
        uses: rui314/setup-mold@v1

      - name: Build moc (Linux, static musl)
        if: runner.os == 'Linux'
        env:
          CC: musl-gcc
          CC_x86_64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: cargo build --release --locked --bin moc --target "$TARGET"

      - name: Build moc (Windows, static CRT)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: cargo build --release --locked --bin moc --target $env:TARGET

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          bin="target/$TARGET/release/moc"
          file "$bin"
          file "$bin" | grep -qE 'statically linked|static-pie linked'
          "$bin" --version
          mkdir -p dist package
          cp "$bin" package/moc
          archive="moc-$VERSION-$PLATFORM.tar.gz"
          tar -C package -czf "dist/$archive" moc
          (cd dist && sha256sum "$archive" > "$archive.sha256")

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = "target/$env:TARGET/release/moc.exe"
          & $bin --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force -Path dist, package | Out-Null
          Copy-Item $bin package/moc.exe
          $archiveName = "moc-$env:VERSION-$env:PLATFORM.zip"
          $archive = Join-Path dist $archiveName
          Compress-Archive -Path package/moc.exe -DestinationPath $archive -Force
          $hash = (Get-FileHash -Algorithm SHA256 -Path $archive).Hash.ToLower()
          "$hash  $archiveName" | Set-Content -Path "$archive.sha256" -Encoding ascii

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: moc-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

      - name: Upload assets to GitHub Release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$VERSION" dist/* --clobber
