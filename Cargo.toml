[workspace]
resolver = "3"
members = ["crates/moc-cli", "crates/moc-core", "crates/moc-llm", "crates/moc-protocol"]
default-members = ["crates/moc-cli"]

[workspace.dependencies]
tokio = { version = "1.53.1", features = ["full"] }
serde = { version = "1.0", features = ["serde_derive"] }
serde_json = { version = "1.0" }
reqwest = { version = "0.13.5", features = ["stream"] }
thiserror = { version = "2.0.21" }
anyhow = { version = "1.0.104" }
clap = { version = "4.5", features = ["derive"] }
futures-core = { version = "0.3.34" }
bytes = { version = "1.12.1" }
tracing = { version = "0.1.44" }
tokio-util = { version = "0.7.19" }
wiremock = { version = "0.6.5" }
toml = "1"
ignore = "0.4"
globset = "0.4"
grep-searcher = "0.1"
grep-regex = "0.1"
grep-matcher = "0.1"
memchr = "2"
xxhash-rust = { version = "0.8", features = ["xxh32", "xxh3"] }
portable-pty = "0.9"
libc = "0.2"
windows-sys = "0.61.2"
uuid = { version = "1", features = ["v7"] }
parking_lot = "0.12"
futures-util = "0.3"
rayon = "1"
tempfile = "3"
