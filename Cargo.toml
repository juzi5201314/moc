[workspace]
resolver = "3"
members = ["crates/moc-cli", "crates/moc-core", "crates/moc-llm", "crates/moc-mcp", "crates/moc-openviking", "crates/moc-plugin", "crates/moc-protocol", "crates/moc-ptc-protocol", "crates/moc-ptc-worker", "crates/moc-tui", "crates/moc-web"]
default-members = ["crates/moc-cli", "crates/moc-tui"]

[workspace.dependencies]
tokio = { version = "1.53.1", features = ["full"] }
serde = { version = "1.0", features = ["serde_derive"] }
serde_json = { version = "1.0" }
serde_yaml = "0.9"
reqwest = { version = "0.13.5", features = ["stream", "json", "gzip"] }
thiserror = { version = "2.0.21" }
anyhow = { version = "1.0.104" }
clap = { version = "4.5", features = ["derive"] }
futures-core = { version = "0.3.34" }
bytes = { version = "1.12.1" }
tracing = { version = "0.1.44" }
tokio-util = { version = "0.7.19" }
wiremock = { version = "0.6.5" }
toml = "1"
base64 = "0.22"
htmd = "0.5"
encoding_rs = "0.8"
roxmltree = "0.20"
globset = "0.4"
ignore = "0.4"
http = "1"
grep-searcher = "0.1"
grep-regex = "0.1"
grep-matcher = "0.1"
memchr = "2"
xxhash-rust = { version = "0.8", features = ["xxh32", "xxh3"] }
portable-pty = "0.9"
libc = "0.2"
windows-sys = "0.61.2"
uuid = { version = "1", features = ["v7"] }
parking_lot = "0.12"
# 跨进程文件锁：会话写租约走 flock/LockFileEx，进程死亡由内核释放。
fs4 = { version = "1.1", features = ["sync"] }
futures-util = "0.3"
rayon = "1"
tempfile = "3"
# shell 词法与语法树：bash/POSIX 解析，替代手写分词
brush-parser = "0.4.0"
# 表格图表：字体解析/光栅化、系统字体回退、PNG 压缩、终端能力探测
ttf-parser = "0.25"
fontdue = "0.9"
fontdb = "0.24"
flate2 = "1"
zstd = "0.13"
rustix = { version = "1", features = ["event"] }
# 插件运行时：与 PTC worker 共用同一份 QuickJS 构建（原生 C，无 WASM）；loader 提供 ESM 解析。
rquickjs = { version = "=0.14.0", features = ["loader"] }

# 测试/开发构建只需要行号，不需要完整 DWARF：
# 完整调试信息会让单个集成测试二进制达到 0.4–0.65GB，
# 多个目标并行链接时峰值内存被放大。
[profile.dev]
debug = 1

[profile.test]
debug = 1
