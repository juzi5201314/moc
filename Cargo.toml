[workspace]
resolver = "3"
members = ["crates/moc-acp", "crates/moc-cli", "crates/moc-core", "crates/moc-i18n", "crates/moc-llm", "crates/moc-mcp", "crates/moc-plugin", "crates/moc-protocol", "crates/moc-ptc-protocol", "crates/moc-ptc-worker", "crates/moc-tui", "crates/moc-web"]
default-members = ["crates/moc-cli", "crates/moc-tui"]

[workspace.dependencies]
tokio = { version = "1.53.1", features = ["full", "test-util"] }
# 统一 workspace 共享 feature 集合（与 moc-acp/axum 对齐），避免切换 -p / --workspace 触发全链重编。
serde = { version = "1.0", features = ["serde_derive", "rc"] }
serde_json = { version = "1.0", features = ["preserve_order", "raw_value"] }
serde_yaml = "0.9"
semver = "1"
sha2 = "0.10"
reqwest = { version = "0.13.5", features = ["stream", "json", "gzip", "multipart"] }
thiserror = { version = "2.0.21" }
anyhow = { version = "1.0.104" }
clap = { version = "4.5", features = ["derive"] }
futures-core = { version = "0.3.34" }
bytes = { version = "1.12.1" }
tracing = { version = "0.1.44", features = ["log"] }
tokio-util = { version = "0.7.19", features = ["io"] }
wiremock = { version = "0.6.5" }
toml = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
base64 = "0.22"
htmd = "0.5"
encoding_rs = "0.8"
roxmltree = "0.20"
globset = "0.4"
ignore = "0.4"
nucleo-matcher = "0.3.1"
http = "1"
grep-searcher = "0.1"
grep-regex = "0.1"
grep-matcher = "0.1"
memchr = "2"
memmap2 = "0.9.11"
xxhash-rust = { version = "0.8", features = ["xxh32", "xxh3"] }
portable-pty = "0.9"
libc = "0.2"
windows-sys = "0.61.2"
uuid = { version = "1", features = ["v7"] }
parking_lot = "0.12"
# 跨进程文件锁：会话写租约走 flock/LockFileEx，进程死亡由内核释放。
fs4 = { version = "1.1", features = ["sync"] }
futures-util = "0.3"
rayon = "1"
tempfile = "3"
# shell 词法与语法树：bash/POSIX 解析，替代手写分词
brush-parser = "0.4.0"
# 表格图表：字体解析/光栅化、系统字体回退、PNG 压缩、终端能力探测
ttf-parser = "0.25"
fontdue = "0.9"
fontdb = "0.24"
flate2 = "1"
zstd = "0.13"
rustix = { version = "1", features = ["event"] }
# 插件运行时：与 PTC worker 共用同一份 QuickJS 构建（原生 C，无 WASM）；loader 提供 ESM 解析。
rquickjs = { version = "=0.14.0", features = ["loader"] }
# 用户面文案本地化：workspace 单份静态排序目录（build.rs 线性解析 locales/*.toml）
moc-i18n = { path = "crates/moc-i18n" }
# 图像编解码（moc-llm / moc-tui / moc-web 统一 feature 集合，避免切换 -p 重编）
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "color_quant", "avif"] }
png = "0.18.1"
gif = "0.14.2"
webpx = { version = "0.4", features = ["animation"] }
# 回收站：5.3.0 发布未满 7 天，钉在 5.2.9。
trash = "=5.2.9"

# 测试/开发构建只需要行号，不需要完整 DWARF：
# 完整调试信息会让单个集成测试二进制达到 0.4–0.65GB，
# 多个目标并行链接时峰值内存被放大。
[profile.dev]
debug = 1

# 优化 proc-macro 与 build.rs（serde_derive、schemars_derive、moc-i18n/moc-web 构建脚本），显著加速增量展开。
[profile.dev.build-override]
opt-level = 2

# 工作区自身 moc-* 保留 debug = 1 行号，外部依赖去除 DWARF 调试信息以加速代码生成与链接并降低峰值内存。
[profile.dev.package."*"]
debug = false

# rav1e 在纯 debug 下极慢；开 opt-level = 2 可将 moc-web 的 AVIF 编码单测从约 5s 压至亚秒。
[profile.dev.package.rav1e]
opt-level = 2

# moc-web 的 build.rs 每次前端变化都要压缩约 17MB 产物；zstd-sys 不开优化时压缩慢数倍。
[profile.dev.package.zstd-sys]
opt-level = 3

# bash 危险命令正则规则的编译与匹配在 opt-level=0 下会耗费数倍 CPU。
[profile.dev.package.grep-matcher]
opt-level = 2
[profile.dev.package.grep-regex]
opt-level = 2
[profile.dev.package.regex]
opt-level = 2
[profile.dev.package.regex-automata]
opt-level = 2
[profile.dev.package.regex-syntax]
opt-level = 2

[profile.test]
debug = 1

# 发布产物不带符号表：`moc` 的 strip 前后差约 15.8MB，
# 而崩溃栈本来就不靠内嵌符号表还原。
[profile.release]
strip = true
