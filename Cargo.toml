[workspace]
resolver = "3"
members = ["crates/moc-cli", "crates/moc-core", "crates/moc-llm", "crates/moc-protocol"]
default-members = ["crates/moc-cli"]

[workspace.dependencies]
tokio = { version = "1.53.1", features = ["full"] }
serde = { version = "1.0", features = ["serde_derive"] }
serde_json = { version = "1.0" }
reqwest = { version = "0.13.5", features = ["stream"] }
thiserror = { version = "2.0.21" }
anyhow = { version = "1.0.104" }
futures-core = { version = "0.3.34" }
bytes = { version = "1.12.1" }
tracing = { version = "0.1.44" }
tokio-util = { version = "0.7.19" }
wiremock = { version = "0.6.5" }
