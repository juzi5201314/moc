[package]
name = "moc-web"
version = "0.1.0"
edition = "2024"
authors = ["soeur@soeur.dev@gmail.com"]

[dependencies]
rust-i18n.workspace = true
moc-core = { path = "../moc-core" }
moc-llm = { path = "../moc-llm" }
moc-protocol = { path = "../moc-protocol" }
axum = { version = "0.8", features = ["ws", "multipart"] }
anyhow.workspace = true
futures-util.workspace = true
serde.workspace = true
tokio.workspace = true
tracing.workspace = true
# 嵌入归档的解压与响应体压缩；与 moc-core 共用同一份 zstd。
zstd.workspace = true
serde_json.workspace = true
toml.workspace = true
portable-pty.workspace = true
bytes.workspace = true
tempfile.workspace = true
sha2.workspace = true
uuid.workspace = true
trash.workspace = true
# Image Playground 图像编解码（静态图含 AVIF / WebP，动图含 GIF / 动图 WebP / APNG）。
image = { workspace = true, features = ["avif"] }
png.workspace = true
gif.workspace = true
webpx.workspace = true
# /fs/raw 的流式下载与取消令牌。
tokio-util = { workspace = true, features = ["io"] }

[build-dependencies]
serde_json.workspace = true
zstd.workspace = true
