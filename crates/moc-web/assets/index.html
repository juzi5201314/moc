<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MOC</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <header class="sidebar-head">
        <span class="brand">MOC</span>
        <button id="new-session" class="icon-button" title="新建会话">＋</button>
      </header>
      <div class="search-row">
        <input id="search" type="search" placeholder="搜索会话…" autocomplete="off">
      </div>
      <nav id="sessions" aria-label="会话列表"></nav>
      <footer id="conn-status">
        <span id="conn-dot" class="dot connecting"></span>
        <span id="conn-label">正在连接…</span>
      </footer>
    </aside>

    <main id="main">
      <header id="topbar">
        <div class="title-block">
          <h1 id="session-title">未选择会话</h1>
          <div id="session-meta" class="meta"></div>
        </div>
        <div class="topbar-actions">
          <div id="badges" class="badges"></div>
          <button id="release-session" class="ghost small" hidden>释放会话</button>
        </div>
      </header>

      <section id="transcript" aria-live="polite">
        <div class="empty-state" id="empty-state">
          <h2>选一个会话开始</h2>
          <p>左侧按工作目录分组；没有会话时点右上角「＋」新建。</p>
        </div>
      </section>

      <footer id="composer">
        <div id="composer-hint" class="hint" hidden></div>
        <textarea id="input" rows="1" placeholder="输入消息，Enter 发送，Shift+Enter 换行" autocomplete="off"></textarea>
        <div class="composer-actions">
          <span id="model-label" class="model-label"></span>
          <button id="stop" class="ghost" hidden>停止</button>
          <button id="send" disabled>发送</button>
        </div>
      </footer>
    </main>
  </div>

  <div id="modal-root"></div>
  <script src="/app.js"></script>
</body>
</html>
