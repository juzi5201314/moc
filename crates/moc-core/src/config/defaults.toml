# moc-core 默认配置。用户配置按表递归覆盖，数组与标量整体替换。

[models.roles]
default = ""
smol = "inherit"
slow = "inherit"
plan = "inherit"

[providers]

[sources]
project_config = true

[tools]
approval_mode = "yolo"

[tools.approval]

[tools.output]
head_bytes = 20480
tail_bytes = 20480
max_file_bytes = 104857600

[tools.bash]
default_timeout_secs = 120
max_timeout_secs = 3600
auto_background_ms = 0
deny_patterns = [
    "(?i)rm\\s+-rf\\s+/(\\s|$)",
    ":\\(\\)\\s*\\{\\s*:\\|\\s*:\\s*&\\s*\\};:",
    "(?i)mkfs\\.",
    "(?i)dd\\s+.*of=/dev/",
    "(?i)\\b(shutdown|reboot|format|diskpart|del|erase|rd|rmdir|stop-computer|restart-computer)\\b",
    "(?i)\\b(remove-item|clear-disk|initialize-disk|remove-partition)\\b",
    ">\\s*/etc/passwd",
]

[tools.read]
default_limit = 300
max_bytes = 51200
line_max_bytes = 204800

[tools.edit]
max_edits = 32
noop_loop_threshold = 3

[tools.write]
hash_echo_min_hits = 2

[tools.grep]
max_files = 20
max_matches_per_file = 20
max_matches_total = 200
line_max_chars = 512
context_before = 1
context_after = 3
max_file_bytes = 4194304
timeout_ms = 30000
max_candidate_files = 20000

[tools.find]
limit = 200
timeout_ms = 5000

[tools.todo]
enabled = true

[tools.job]
enabled = true
max_running = 4
overflow = "error"

[compaction]
enabled = true
method_order = ["remote", "shake", "soft"]
threshold = { mode = "percent", value = 85 }
keep_recent_tokens = 20000
protect_recent_tool_tokens = 20000
mid_turn = true
auto = true
auto_continue = true

[compaction.shake]
soft_trim_chars = 4000
head_chars = 1500
tail_chars = 1500
hard_clear_turns = 10
keep_last_turns = 3
supersede_reads = true

[compaction.remote]
enabled = true
server_side = true
retained_message_tokens = 64000


[system_prompt]
override = ""
append = ""

[context_files]
enabled = true
user = true
project = true
max_tokens = 16000
import_depth = 5

[workspace]
watch = true
max_scan_entries = 100000

[openviking]
url = ""
api_key = ""
timeout_secs = 15
recall = true
capture = true
skills = true
peer_scope = "actor"
max_context_tokens = 1600

[session]
dir = "~/.moc/sessions"

[session.retention]
enabled = true
archive_after_days = 30
retain_newest_global = 20
retain_newest_per_workspace = 10
artifacts_days = 30
logs_days = 14

[limits]
max_steps_per_turn = 128
max_length_continues = 2

[mcp]
enabled = true
user_config = true
project_config = true
connect_timeout_secs = 15
call_timeout_secs = 120
max_output_chars = 40960

[mcp.servers]

[skills]
enabled = true
moc_user = true
moc_project = true
agents_user = true
agents_project = true
dirs = []
disable = []
catalog_budget_percent = 1
catalog_budget_min_tokens = 8000
description_max_chars = 1024
