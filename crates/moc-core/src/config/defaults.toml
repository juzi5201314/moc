# moc-core 默认配置。用户配置按表递归覆盖，数组与标量整体替换。

# 特性开关覆盖：只接受注册表自有键（clm、ptc）。workflow/plugins/mcp/skills/
# web_search/web_fetch 等特性由各自配置段的 enabled 控制（见 /features 一览），
# 误写进本段会被校验拒绝并提示正确路径。
[features]
# CLM 实验引擎（SessionEngine::ClmExperimental）
clm = true
# PTC 引擎（SessionEngine::Ptc）：模型只调 run_code，工具经代码沙盒触达
ptc = true

[models.roles]
explore = "inherit"

# Fusion 组合：lead 负责规划与对话，sidekick 负责执行；两侧都为空表示未配置，
# 此时选择器 `fusion` 会报错。格式同为 供应商/模型[:等级]。
[models.fusion]
lead = ""
sidekick = ""

[providers]
# 供应商与模型字段在 /config 的供应商页维护；逐模型 compat 字段以 src/config/catalog.rs
# 的模型模板为准。

[sandbox]
# 新会话默认模式：full（不隔离）、workspace（工作区可写、外部只读）、workspace_only（外部不可读写）
default_mode = "full"
# 仅约束沙盒内 bash；web_fetch/web_search/MCP 不受影响
network = true
# ask：越界时向用户申请；deny：直接拒绝
on_denied = "ask"
# 是否允许模型申请 full（沙盒外）执行一次
allow_unsandboxed = true
# Linux：把 $HOME 挂成会话级 copy-on-write 层，包管理器缓存可写但不落盘
overlay_home = true
# 额外只读/读写路径；支持 ~，必须存在
extra_read_paths = []
extra_write_paths = []
# 强制拒绝路径；优先于允许列表
deny_read_paths = []
deny_write_paths = []

[tools]
max_concurrent_calls = 16
[tools.ptc]
default_timeout_secs = 300
max_timeout_secs = 1800
memory_limit_bytes = 134217728
max_output_bytes = 4194304
max_result_bytes = 16777216
max_pending_calls = 256
max_total_calls = 1000
max_concurrent_runs = 16
host_idle_timeout_secs = 600
max_state_bytes = 16777216


[tools.output]
head_bytes = 20480
tail_bytes = 20480
max_file_bytes = 104857600

[tools.bash]
foreground_after_secs = 60
monitored_timeout_secs = 1800
stall_after_secs = 120
max_timeout_secs = 3600
max_output_bytes = 16777216
persistent_log_bytes = 16777216
# 开启后，只读/搜索/列目录/改工作区文件的 bash 命令会被拒绝并给出等价的
# read/grep/find/edit/write 调用；过滤命令输出等正常用法不受影响。
prefer_builtin = true
deny_patterns = [
    # 命中的命令先向用户申请确认（允许一次/本会话允许该命令/拒绝），不是直接拒绝；
    # 引号内的纯数据不算命中，除非命令行里有 bash -c、eval、解释器、管道进 shell 等执行型动词。
    # 递归删除作用于整个文件环境：/、~、$HOME、顶层系统目录及其一级子项；rm 标志可前可后。
    "(?i)\\brm\\b[^;&|]*?(?:-[a-z]*r[a-z]*f[a-z]*|-[a-z]*f[a-z]*r[a-z]*|-[a-z]*r[a-z]*\\s+-[a-z]*f[a-z]*|-[a-z]*f[a-z]*\\s+-[a-z]*r[a-z]*|--recursive[^;&|]*--force|--force[^;&|]*--recursive)[^;&|]*?(?:^|[\\s;&|\"'{(=,:])(?:/{1,2}(?:\\.{0,2}|\\*)?/?\\*?|~[-\\w]*/?\\*?|\\$\\{?HOME\\}?/?\\*?|/(?:etc|usr|var|bin|sbin|lib(?:32|64)?|boot|root|home|opt|srv|sys|proc|dev|mnt|media|run)(?:/[-\\w.]+)?/?\\*?|/tmp/?\\*?)(?:[\\s;&|\"'{)`]|$)",
    "(?i)\\brm\\b[^;&|]*?(?:^|[\\s;&|\"'{(=,:])(?:/{1,2}(?:\\.{0,2}|\\*)?/?\\*?|~[-\\w]*/?\\*?|\\$\\{?HOME\\}?/?\\*?|/(?:etc|usr|var|bin|sbin|lib(?:32|64)?|boot|root|home|opt|srv|sys|proc|dev|mnt|media|run)(?:/[-\\w.]+)?/?\\*?|/tmp/?\\*?)(?:[\\s;&|\"'{)`]|$)[^;&|]*?(?:-[a-z]*r[a-z]*f[a-z]*|-[a-z]*f[a-z]*r[a-z]*|-[a-z]*r[a-z]*\\s+-[a-z]*f[a-z]*|-[a-z]*f[a-z]*\\s+-[a-z]*r[a-z]*|--recursive[^;&|]*--force|--force[^;&|]*--recursive)",
    # find 对整个环境 -delete / -exec rm / 管道进 xargs rm。
    "(?i)\\bfind\\b[^;&|]*?(?:^|[\\s;&|\"'{(=,:])(?:/{1,2}(?:\\.{0,2}|\\*)?/?\\*?|~[-\\w]*/?\\*?|\\$\\{?HOME\\}?/?\\*?|/(?:etc|usr|var|bin|sbin|lib(?:32|64)?|boot|root|home|opt|srv|sys|proc|dev|mnt|media|run)(?:/[-\\w.]+)?/?\\*?|/tmp/?\\*?)(?:[\\s;&|\"'{)`]|$)[^;&|]*(?:-delete\\b|-exec(?:dir)?[^;&|]*\\brm\\b)",
    "(?i)\\bfind\\b[^;&|]*?(?:^|[\\s;&|\"'{(=,:])(?:/{1,2}(?:\\.{0,2}|\\*)?/?\\*?|~[-\\w]*/?\\*?|\\$\\{?HOME\\}?/?\\*?|/(?:etc|usr|var|bin|sbin|lib(?:32|64)?|boot|root|home|opt|srv|sys|proc|dev|mnt|media|run)(?:/[-\\w.]+)?/?\\*?|/tmp/?\\*?)(?:[\\s;&|\"'{)`]|$)[^;&]*\\|\\s*xargs[^;&|]*\\brm\\b",
    # chmod/chown/chgrp 递归作用于整个环境。
    "(?i)\\b(?:chmod|chown|chgrp)\\s+[^;&|]*-[a-z]*r[a-z]*\\s[^;&|]*?(?:^|[\\s;&|\"'{(=,:])(?:/{1,2}(?:\\.{0,2}|\\*)?/?\\*?|~[-\\w]*/?\\*?|\\$\\{?HOME\\}?/?\\*?|/(?:etc|usr|var|bin|sbin|lib(?:32|64)?|boot|root|home|opt|srv|sys|proc|dev|mnt|media|run)(?:/[-\\w.]+)?/?\\*?|/tmp/?\\*?)(?:[\\s;&|\"'{)`]|$)",
    # fork 炸弹。
    ":\\(\\)\\s*\\{\\s*:\\|\\s*:\\s*&\\s*\\};:",
    # 格式化或覆写块设备与分区表。
    "(?i)\\b(?:mkfs(?:\\.[\\w-]+)?|mke2fs|mkdosfs|mkntfs|mkexfatfs|mkudffs|mkhfs|mkswap)\\b",
    "(?i)\\bdd\\s+.*of=/dev/(?:sd|hd|vd|xvd|nvme|mmcblk|loop|dm-|disk)",
    "(?i)(?:>\\s*|\\btee\\b[^;&|]*?)/dev/(?:sd|hd|vd|xvd|nvme|mmcblk|loop|dm-|disk)",
    "(?i)\\b(?:cp|mv|install|rsync)\\s+\\S+\\s+[^;&|]*/dev/(?:sd|hd|vd|xvd|nvme|mmcblk|loop|dm-|disk)",
    "(?i)\\btar\\s+[^;&|]*-[a-z]*c[a-z]*f[a-z]*\\s*/dev/(?:sd|hd|vd|xvd|nvme|mmcblk|loop|dm-|disk)",
    "(?i)\\bshred\\b[^;&|]*/dev/(?:sd|hd|vd|xvd|nvme|mmcblk|loop|dm-|disk)",
    "(?i)\\bwipefs\\b[^;&|]*(?:-a\\b|--all\\b)",
    "(?i)\\b(?:fdisk|sfdisk)\\s+/dev/|\\bparted\\s+(?:-\\S+\\s+)*/dev/\\S+\\s+(?:mklabel|mkpart|rm|move|resize|rescue|set)\\b|\\bsgdisk\\b[^;&|]*(?:-Z\\b|--zap-all\\b)",
    # 覆写关键系统账户/引导文件。
    "(?i)(?:>\\s*|\\btee\\b[^;&|]*?)/etc/(?:passwd|shadow|sudoers|gshadow|fstab)\\b",
    # 命令位置的关机/格式化/Windows 危险动词；分隔符锚定避免误伤 clang-format 等命令名。
    "(?i)(?:^|[;&|`'\"\\n])\\s*(?:(?:sudo|doas|pkexec|run0|busybox)\\s+)?(?:shutdown|reboot|halt|poweroff|format|diskpart|del|erase|rd|rmdir|stop-computer|restart-computer|remove-item|clear-disk|initialize-disk|remove-partition)\\b",
    "(?i)\\bsystemctl\\s+[^;&|]*\\b(?:halt|poweroff|reboot|kexec|soft-reboot)\\b",
    # 销毁存储卷、系统账户、防火墙规则、swap、cron。
    "(?i)\\b(?:lvremove|vgremove|pvremove|userdel|groupdel|deluser|delgroup)\\b|\\bcryptsetup\\s+(?:luksFormat|luksErase|erase|reencrypt)\\b|\\bzpool\\s+(?:destroy|labelclear)\\b|\\bzfs\\s+destroy\\b[^;&|]*-[a-z]*r[a-z]*",
    "(?i)\\bip6?tables\\b[^;&|]*-F\\b|\\bnft\\s+flush\\b|\\bswapoff\\s+[^;&|]*-a\\b|\\bcrontab\\s+-[a-z]*r",
    # 向全部进程发信号。
    "\\b(?:kill|skill)\\b[^;&|]*\\s-1\\s*(?:[;&|]|$)|\\bpkill\\s+[^;&|]*-f\\s*['\"]?\\.['\"]?\\s*(?:[;&|]|$)",
]

[tools.bash.limits]
# 关闭时完全不介入；开启后每条 agent bash 各自独占一个资源范围，额度不共享。
enabled = false
# CPU 核数上限；0 表示不限。Linux 走 cgroup CPUQuota（nproc 与 cargo 并发会跟着下降），
# Windows 走 Job Object CPU rate（只限速，不改变并发度）。
cpu_cores = 4
# 内存软限（字节）：超过就节流、明显变慢，但尽量不失败；0 表示不节流。仅 Linux 生效。
# 宿主没有 swap 时该值会被自动忽略，避免进程无限期停等。
memory_high_bytes = 8589934592
# 内存硬顶（字节）：兜底，超过按 OOM 终止；0 表示不设。仅 Linux 生效。
memory_max_bytes = 12884901888
# swap 预算（字节）：0 表示不限制。仅 Linux 生效。
memory_swap_bytes = 4294967296

[tools.read]
default_limit = 300
max_bytes = 262144
line_max_bytes = 4096

[tools.edit]
max_edits = 32
noop_loop_threshold = 3

[tools.write]
hash_echo_min_hits = 2

[tools.grep]
max_files = 20
max_matches_per_file = 20
max_matches_total = 200
line_max_chars = 200
output_bytes = 131072
context_before = 0
context_after = 0
max_file_bytes = 4194304
timeout_ms = 30000
max_candidate_files = 20000

[tools.find]
limit = 200
timeout_ms = 5000

[tools.todo]
enabled = true
reminders = true
reminders_after = 12
reminders_max = 3

[tools.job]
enabled = true
max_running = 8
max_wait_secs = 600
overflow = "error"

[compaction]
enabled = true
# moc：本地修剪+摘要；grok_build：Grok Build；eocc：实验性交接状态
method = "moc"
threshold = { mode = "percent", value = 85 }
keep_recent_tokens = 20000
protect_recent_tool_tokens = 20000
mid_prompt = true
auto = true
auto_continue = true

[compaction.shake]
soft_trim_chars = 4000
head_chars = 1500
tail_chars = 1500
hard_clear_prompts = 10
keep_last_prompts = 3
supersede_reads = true


[system_prompt]
override = ""
append = ""

[context_files]
enabled = true
user = true
project = true
max_tokens = 16000
import_depth = 5

[workspace]
watch = true
max_scan_entries = 100000

[session]
dir = "~/.moc/sessions"
compress = false

[session.retention]
enabled = true
artifacts_days = 30
logs_days = 14

[limits]
max_length_continues = 2
loop_detection = true
connect_deadline_secs = 900
request_warn_secs = 900

[mcp]
enabled = true
user_config = true
project_config = false
connect_timeout_secs = 15
call_timeout_secs = 120
# 同一 server 的并发调用上限；默认串行。单 server 可在条目里覆盖：
# [mcp.servers.demo] max_concurrent_calls = 4
max_concurrent_calls = 1

[mcp.servers]

[skills]
enabled = true
moc_user = true
moc_project = true
agents_user = true
agents_project = true
dirs = []
disable = []
catalog_budget_percent = 1
catalog_budget_min_tokens = 8000
description_max_chars = 1024

[plugins]
# 本地插件系统：每个插件是目录里的 ES 模块（plugin.json + index.js），在 core 进程内
# 用 QuickJS 执行。插件可注册工具、斜杠命令、工具钩子与提示词贡献。
enabled = true
# 扫描用户目录 $MOC_HOME/plugins。
user = true
# 扫描项目目录 .moc/plugins（cwd 向上到 git root）。插件是会被执行的代码，
# 开启项目级来源等于信任该仓库；克隆不可信仓库前请确认。
project = true
# 额外扫描目录；支持 ~。
dirs = []
# 按插件名禁用，其余发现到的插件自动启用。
disable = []
max_plugins = 32
memory_limit_bytes = 67108864
load_timeout_ms = 5000
# 单次调用超时；超时的插件在本进程内禁用，需要重启 moc 恢复。
call_timeout_ms = 5000
# 全部插件提示词贡献的总字符上限。
max_prompt_chars = 4000

[agents]
# 允许的最大子代理委托深度：1 = 顶层可 spawn，子代理不能再 spawn；
# 每加 1 多允许一层嵌套委托。
max_depth = 1

[web_search]
enabled = true
provider = "tavily"
api_key = ""
base_url = ""
timeout_secs = 30

[web_fetch]
enabled = true
timeout_secs = 30
max_bytes = 52428800
max_chars = 500000
