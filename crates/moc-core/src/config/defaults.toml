# moc-core 默认配置。用户配置按表递归覆盖，数组与标量整体替换。

[models.roles]
default = ""
explore = "inherit"
plan = "inherit"

[providers]
# 供应商与模型字段在 /config 的供应商页维护；逐模型 compat 字段以 src/config/catalog.rs
# 的模型模板为准。/config 字段说明会列出下列片段名，此处同步一份：
# instruction_role 指定指令消息（工具政策、仓库规则等）的角色，默认 system；
# instruction_system 列出指令角色为 user 时仍留在 system 消息里的片段，默认
# ["intro", "tool declarations", "mcp servers", "environment"]，留空表示整条指令都用 user。
# 可用片段名：intro、tool policy、ptc runtime、tool declarations、mcp servers、repo rules、
# skills、subagent、environment、append。

[sandbox]
# 新会话默认模式：full（不隔离）、workspace（工作区可写、外部只读）、workspace_only（外部不可读写）
default_mode = "full"
# 仅约束沙盒内 bash；web_fetch/web_search/MCP 不受影响
network = true
# ask：越界时向用户申请；deny：直接拒绝
on_denied = "ask"
# 是否允许模型申请 full（沙盒外）执行一次
allow_unsandboxed = true
# Linux：把 $HOME 挂成会话级 copy-on-write 层，包管理器缓存可写但不落盘
overlay_home = true
# 额外只读/读写路径；支持 ~，必须存在
extra_read_paths = []
extra_write_paths = []
# 强制拒绝路径；优先于允许列表
deny_read_paths = []
deny_write_paths = []

[tools]
max_concurrent_calls = 16
[tools.ptc]
default_timeout_secs = 300
max_timeout_secs = 1800
memory_limit_bytes = 134217728
max_output_bytes = 4194304
max_result_bytes = 16777216
max_pending_calls = 256
max_total_calls = 1000
max_concurrent_runs = 16
host_idle_timeout_secs = 600
max_state_bytes = 16777216


[tools.output]
head_bytes = 20480
tail_bytes = 20480
max_file_bytes = 104857600

[tools.bash]
foreground_after_secs = 60
monitored_timeout_secs = 1800
slow_warning_interval_secs = 180
max_timeout_secs = 3600
max_output_bytes = 16777216
persistent_log_bytes = 16777216
deny_patterns = [
    "(?i)rm\\s+-rf\\s+/(\\s|$)",
    ":\\(\\)\\s*\\{\\s*:\\|\\s*:\\s*&\\s*\\};:",
    "(?i)mkfs\\.",
    "(?i)dd\\s+.*of=/dev/",
    "(?i)\\b(shutdown|reboot|format|diskpart|del|erase|rd|rmdir|stop-computer|restart-computer)\\b",
    "(?i)\\b(remove-item|clear-disk|initialize-disk|remove-partition)\\b",
    ">\\s*/etc/passwd",
]

[tools.bash.limits]
# 关闭时完全不介入；开启后每条 agent bash 各自独占一个资源范围，额度不共享。
enabled = false
# CPU 核数上限；0 表示不限。Linux 走 cgroup CPUQuota（nproc 与 cargo 并发会跟着下降），
# Windows 走 Job Object CPU rate（只限速，不改变并发度）。
cpu_cores = 4
# 内存软限（字节）：超过就节流、明显变慢，但尽量不失败；0 表示不节流。仅 Linux 生效。
# 宿主没有 swap 时该值会被自动忽略，避免进程无限期停等。
memory_high_bytes = 8589934592
# 内存硬顶（字节）：兜底，超过按 OOM 终止；0 表示不设。仅 Linux 生效。
memory_max_bytes = 12884901888
# swap 预算（字节）：0 表示不限制。仅 Linux 生效。
memory_swap_bytes = 4294967296

[tools.read]
default_limit = 300
max_bytes = 51200
line_max_bytes = 4096

[tools.edit]
max_edits = 32
noop_loop_threshold = 3

[tools.write]
hash_echo_min_hits = 2

[tools.grep]
max_files = 20
max_matches_per_file = 20
max_matches_total = 200
line_max_chars = 200
output_bytes = 24576
context_before = 0
context_after = 0
max_file_bytes = 4194304
timeout_ms = 30000
max_candidate_files = 20000

[tools.find]
limit = 200
timeout_ms = 5000

[tools.todo]
enabled = true
reminders = true
reminders_after = 12
reminders_max = 3

[tools.job]
enabled = true
max_running = 4
overflow = "error"

[compaction]
enabled = true
method_order = ["remote", "shake", "soft"]
soft_method = "moc"
threshold = { mode = "percent", value = 85 }
keep_recent_tokens = 20000
protect_recent_tool_tokens = 20000
mid_prompt = true
auto = true
auto_continue = true

[compaction.shake]
soft_trim_chars = 4000
head_chars = 1500
tail_chars = 1500
hard_clear_prompts = 10
keep_last_prompts = 3
supersede_reads = true

[compaction.remote]
enabled = true
server_side = true
retained_message_tokens = 64000


[system_prompt]
override = ""
append = ""

[context_files]
enabled = true
user = true
project = true
max_tokens = 16000
import_depth = 5

[workspace]
watch = true
max_scan_entries = 100000

[session]
dir = "~/.moc/sessions"
compress = false

[session.retention]
enabled = true
artifacts_days = 30
logs_days = 14

[limits]
max_length_continues = 2
loop_detection = true
connect_deadline_secs = 900
request_warn_secs = 900

[mcp]
enabled = true
user_config = true
project_config = false
connect_timeout_secs = 15
call_timeout_secs = 120
# 同一 server 的并发调用上限；默认串行。单 server 可在条目里覆盖：
# [mcp.servers.demo] max_concurrent_calls = 4
max_concurrent_calls = 1

[mcp.servers]

[skills]
enabled = true
moc_user = true
moc_project = true
agents_user = true
agents_project = true
dirs = []
disable = []
catalog_budget_percent = 1
catalog_budget_min_tokens = 8000
description_max_chars = 1024

[plugins]
# 本地插件系统：每个插件是目录里的 ES 模块（plugin.json + index.js），在 core 进程内
# 用 QuickJS 执行。插件可注册工具、斜杠命令、工具钩子与提示词贡献。
enabled = true
# 扫描用户目录 $MOC_HOME/plugins。
user = true
# 扫描项目目录 .moc/plugins（cwd 向上到 git root）。插件是会被执行的代码，
# 开启项目级来源等于信任该仓库；克隆不可信仓库前请确认。
project = true
# 额外扫描目录；支持 ~。
dirs = []
# 按插件名禁用，其余发现到的插件自动启用。
disable = []
max_plugins = 32
memory_limit_bytes = 67108864
load_timeout_ms = 5000
# 单次调用超时；超时的插件在本进程内禁用，需要重启 moc 恢复。
call_timeout_ms = 5000
# 全部插件提示词贡献的总字符上限。
max_prompt_chars = 4000

[web_search]
enabled = true
provider = "tavily"
api_key = ""
base_url = ""
timeout_secs = 30

[web_fetch]
enabled = true
timeout_secs = 30
max_bytes = 52428800
max_chars = 500000
