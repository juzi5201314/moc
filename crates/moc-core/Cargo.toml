[package]
name = "moc-core"
version = "0.1.0"
edition = "2024"
authors = ["soeur@soeur.dev@gmail.com"]

[dependencies]
moc-llm = { path = "../moc-llm" }
moc-openviking = { path = "../moc-openviking" }
moc-mcp = { path = "../moc-mcp" }
moc-protocol = { path = "../moc-protocol" }
anyhow.workspace = true
bytes.workspace = true
futures-core.workspace = true
futures-util.workspace = true
globset.workspace = true
base64.workspace = true
grep-matcher.workspace = true
grep-regex.workspace = true
grep-searcher.workspace = true
ignore.workspace = true
libc.workspace = true
memchr.workspace = true
parking_lot.workspace = true
portable-pty.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
toml.workspace = true
tracing.workspace = true
uuid.workspace = true
rayon.workspace = true
reqwest.workspace = true
htmd.workspace = true
encoding_rs.workspace = true
roxmltree.workspace = true
flate2.workspace = true
async-compression = { version = "0.4", features = ["tokio", "gzip"] }
aho-corasick = "1"
xxhash-rust.workspace = true
shell-words.workspace = true
wasmtime = { version = "=49.0.2", default-features = false, features = ["std", "runtime", "cranelift", "async", "anyhow"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile.workspace = true
wiremock.workspace = true
