[package]
name = "moc-core"
version = "0.1.0"
edition = "2024"
authors = ["soeur@soeur.dev@gmail.com"]

[dependencies]
moc-llm = { path = "../moc-llm" }
moc-mcp = { path = "../moc-mcp" }
moc-plugin = { path = "../moc-plugin" }
moc-protocol = { path = "../moc-protocol" }
moc-ptc-protocol = { path = "../moc-ptc-protocol" }
anyhow.workspace = true
bytes.workspace = true
futures-core.workspace = true
futures-util.workspace = true
globset.workspace = true
base64.workspace = true
grep-matcher.workspace = true
grep-regex.workspace = true
grep-searcher.workspace = true
ignore.workspace = true
libc.workspace = true
memchr.workspace = true
memmap2.workspace = true
parking_lot.workspace = true
fs4.workspace = true
portable-pty.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
thiserror.workspace = true
tempfile.workspace = true
tokio.workspace = true
tokio-util.workspace = true
toml.workspace = true
tracing.workspace = true
uuid.workspace = true
rayon.workspace = true
reqwest.workspace = true
htmd.workspace = true
encoding_rs.workspace = true
roxmltree.workspace = true
flate2.workspace = true
zstd.workspace = true
aho-corasick = "1"
xxhash-rust.workspace = true
brush-parser.workspace = true
jsonschema = { version = "0.60.2", default-features = false }
oxc_parser = "=0.96.0"
oxc_ast = "=0.96.0"
oxc_semantic = "=0.96.0"
oxc_span = "=0.96.0"
oxc_ast_visit = "=0.96.0"
oxc_allocator = "=0.96.0"
sysinfo = { version = "=0.40.0", default-features = false, features = ["system"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
wiremock.workspace = true
