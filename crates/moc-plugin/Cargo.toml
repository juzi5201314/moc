[package]
name = "moc-plugin"
version = "0.1.0"
edition = "2024"
authors = ["soeur@soeur.dev@gmail.com"]
description = "moc 插件运行时：本地目录发现、QuickJS 执行与宿主桥接"

# 无文档测试；避免 cargo test --workspace 对零用例库重复跑 rustdoc。
[lib]
doctest = false

[dependencies]
moc-i18n.workspace = true
rquickjs.workspace = true
serde_json.workspace = true
serde.workspace = true
parking_lot.workspace = true
tokio.workspace = true
tracing.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true
