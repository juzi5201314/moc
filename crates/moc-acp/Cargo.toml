[package]
name = "moc-acp"
version = "0.1.0"
edition = "2024"
authors = ["soeur@soeur.dev@gmail.com"]

# 无文档测试；避免 cargo test --workspace 对零用例库重复跑 rustdoc。
[lib]
doctest = false

[dependencies]
rust-i18n.workspace = true
moc-core = { path = "../moc-core" }
moc-protocol = { path = "../moc-protocol" }
agent-client-protocol = { version = "=3.6.0", features = ["stdio"] }
anyhow.workspace = true
# 会话列表里的 updated_at 要 RFC 3339 文本；统一走 workspace feature，避免与 moc-tui 重复编译。
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true
