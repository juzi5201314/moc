[package]
name = "moc-tui"
version = "0.1.0"
edition = "2024"
authors = ["soeur@soeur.dev@gmail.com"]

[dependencies]
moc-core = { path = "../moc-core" }
moc-protocol = { path = "../moc-protocol" }
ratatui = "0.30.2"
crossterm = "0.29"
pulldown-cmark = { version = "0.13", features = ["simd"] }
syntect = { version = "5.3", default-features = false, features = [
    "default-fancy",
] }
two-face = "0.5"
unicode-width = "0.2"
anyhow.workspace = true
thiserror.workspace = true
base64 = "0.22"
# 消息时间戳按本地时区格式化（`clock` 特性走 iana-time-zone）。
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tokio.workspace = true
tokio-util.workspace = true
futures-util.workspace = true
serde_json.workspace = true
serde.workspace = true
toml.workspace = true
tracing.workspace = true
ttf-parser.workspace = true
fontdue.workspace = true
fontdb.workspace = true
flate2.workspace = true
xxhash-rust.workspace = true
# 通用内联图片：位图解码（PNG/JPEG/GIF/WebP）与 NeuQuant 量化
image = { version = "0.25.10", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
    "color_quant",
] }
# NeuQuant 量化：`image` 的 `color_quant` 特性只启用 impl，不重导出类型
color_quant = "1"
# SVG 代码块的光栅化（自带 usvg / tiny-skia）
resvg = { version = "0.48.1", default-features = false, features = [
    "text",
    "system-fonts",
] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "ansi"] }

# 终端图形能力探测要直接读 fd 0（`#![forbid(unsafe_code)]` 下不能调 libc）：
# `rustix` 提供安全封装的 poll/read，非 unix 平台不引入。
[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[dev-dependencies]
tempfile.workspace = true
wiremock.workspace = true
